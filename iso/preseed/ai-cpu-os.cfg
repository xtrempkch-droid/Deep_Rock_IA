# ai-cpu-os — arquivo de preseed do debian-installer
# -----------------------------------------------------------------------------
# Este arquivo é um TEMPLATE. O script `iso/build-iso.sh` substitui os
# marcadores (nomes entre arrobas duplas) e grava o resultado em
# `/preseed/ai-cpu-os.cfg` dentro da ISO.
#
# Ele responde automaticamente a todas as perguntas do instalador Debian, de
# forma NÃO interativa (`priority=critical`), e delega o trabalho pesado ao
# `late-command.sh`, que copia o projeto para o sistema instalado.
#
# ⚠️ AVISO DESTRUTIVO: o particionamento apaga o disco escolhido no build da
#    ISO (opção --disk). Não instale esta ISO em uma máquina com dados que
#    você queira manter.
#
# Referência: https://www.debian.org/releases/stable/amd64/apbs04.pt.html

## ---------------------------------------------------------------------------
## Localização, teclado e fuso
## ---------------------------------------------------------------------------
d-i debian-installer/locale string @@LOCALE@@
d-i debian-installer/language string @@LANG@@
d-i debian-installer/country string @@COUNTRY@@
## A pergunta que o `localechooser` REALMENTE exibe é
## `localechooser/languagelist` (a lista de idiomas), não
## `debian-installer/language`. Ela só é pulada quando o idioma preseedado
## está entre as ESCOLHAS da lista — e a lista é montada por nível de exibição:
## em console serial o nível é 0 (`language_display_level`), onde só existe
## `en`. Resultado medido: com `language=pt` na cmdline a interface ficava em
## português e MESMO ASSIM a pergunta "Select a language" aparecia e a
## instalação parava ali para sempre. Responder a lista diretamente marca
## `seen=true` e ela é pulada em qualquer console.
d-i localechooser/languagelist select @@LANG@@
d-i keyboard-configuration/xkb-keymap select @@KEYMAP@@
d-i keyboard-configuration/toggle select No toggling
d-i console-setup/ask_detect boolean false

## ---------------------------------------------------------------------------
## Rede
## ---------------------------------------------------------------------------
## O bloco abaixo é expandido pelo build-iso.sh conforme --network:
##   auto/dhcp → choose_interface + disable_autoconfig false (DHCP)
##   static    → disable_autoconfig true + ip/netmask/gateway/dns
##   none      → só choose_interface auto (o instalador decide)
## Sem isso o alvo podia subir sem rede (o d-i escreve /etc/network/interfaces
## apenas quando a pergunta de rede é respondida de fato).
@@NETWORK_PRESEED@@
d-i netcfg/get_hostname string @@HOSTNAME@@
d-i netcfg/get_domain string local
d-i hw-detect/load_firmware boolean true

## ---------------------------------------------------------------------------
## Espelho do apt
## ---------------------------------------------------------------------------
d-i mirror/country string manual
d-i mirror/protocol string http
d-i mirror/http/hostname string @@MIRROR_HOST@@
d-i mirror/http/directory string @@MIRROR_DIR@@
d-i mirror/http/proxy string

## Não usar o CD como fonte do apt (evita quebrar depois de ejetar a mídia).
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/services-select multiselect security, updates
d-i apt-setup/non-free-firmware boolean false
d-i apt-setup/enable-source-repositories boolean false
d-i debian-installer/allow_unauthenticated boolean false

## Repositório apt local da mídia (--iso-repo): fonte EXTRA, para o alvo não
## precisar de internet ao instalar pacotes. O marcador abaixo é expandido por
## `expand_apt_local_block` no build-iso.sh — sem repositório na mídia, as três
## linhas desaparecem.
## (`allow_unauthenticated` acima já cobre um repositório local não assinado.)
@@APT_LOCAL_PRESEED@@

## ---------------------------------------------------------------------------
## Relógio (UTC recomendado em servidor)
## ---------------------------------------------------------------------------
d-i clock-setup/utc boolean true
d-i time/zone string @@TIMEZONE@@
d-i clock-setup/ntp boolean true

## ---------------------------------------------------------------------------
## Particionamento — ATENÇÃO: apaga o disco escolhido
## ---------------------------------------------------------------------------
d-i partman-auto/method string regular
@@PARTMAN_DISK@@
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-md/confirm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-lvm/device_remove_lvm boolean true

## ---------------------------------------------------------------------------
## Usuário — root bloqueado por padrão, usuário administrativo com sudo
## A linha do marcador de root logo abaixo é expandida pelo build-iso.sh: com
## --root-password-hash, vira root-login true + senha crypt; sem ele,
## root-login false (bloqueado).
## ---------------------------------------------------------------------------
d-i user-setup/allow-password-weak boolean true
@@ROOT_PRESEED@@
d-i passwd/make-user boolean true
d-i passwd/user-fullname string @@USER_FULLNAME@@
d-i passwd/username string @@USERNAME@@
d-i passwd/user-password-crypted password @@PASSWORD_HASH@@
d-i passwd/user-default-groups string sudo

## ---------------------------------------------------------------------------
## Pacotes — base mínima pronta para o primeiro boot
## ---------------------------------------------------------------------------
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string @@EXTRA_PACKAGES@@
d-i pkgsel/upgrade select full-upgrade
d-i pkgsel/install-language-support boolean false
popularity-contest popularity-contest/participate boolean false
d-i pkgsel/updatedb boolean false

## ---------------------------------------------------------------------------
## Bootloader — instalar no disco alvo, sem perguntar
## ---------------------------------------------------------------------------
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean @@GRUB_WITH_OTHER_OS@@
# Preserva o tuning de C-states feito pelo ai-cpu-os se o GRUB já o tiver.
d-i grub-installer/update-grub-cmdline boolean true
## `grub-installer/bootdev` é pergunta CRÍTICA: sem resposta o d-i abre
## "[!!] Configurando grub-pc" e ESPERA por um dispositivo — depois de já ter
## instalado o sistema inteiro (medido numa VM de verdade, sessão #35). Com o
## disco fixado respondemos o mesmo disco do partman; sem disco fixado,
## `default` deixa o grub-installer escolher sozinho.
@@GRUB_BOOTDEV@@

## ---------------------------------------------------------------------------
## Pós-instalação: copia o projeto para /opt/ai-cpu-os e agenda a aplicação
## no primeiro boot (ver iso/preseed/late-command.sh).
## ---------------------------------------------------------------------------
d-i preseed/late_command string sh /preseed/late-command.sh

## ---------------------------------------------------------------------------
## Finalização
## ---------------------------------------------------------------------------
d-i finish-install/reboot_in_progress note
d-i debian-installer/exit/poweroff boolean false
