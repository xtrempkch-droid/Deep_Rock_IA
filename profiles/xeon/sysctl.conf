# /etc/sysctl.d/99-ai-tuning.conf (perfil xeon)
#
# Este arquivo é uma REFERÊNCIA do perfil xeon. O arquivo efetivamente
# aplicado é gerado por common/kernel-tuning.sh (que detecta single/multi
# socket e ajusta kernel.numa_balancing dinamicamente).
#
# Em máquinas single-socket (caso do Xeon E5-2678 v3), numa_balancing=0.
# Ver docs/TUNING.md para a justificativa de cada valor.

# --- Memória ---
vm.swappiness = 10
vm.vfs_cache_pressure = 50
vm.dirty_ratio = 15
vm.dirty_background_ratio = 5

# --- NUMA (single-socket) ---
kernel.numa_balancing = 0

# --- Rede (llama-server HTTP) ---
net.core.rmem_max = 134217728
net.core.wmem_max = 134217728
net.core.rmem_default = 16777216
net.core.wmem_default = 16777216
