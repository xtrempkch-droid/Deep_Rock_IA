name: build-llama

# Compila o llama.cpp com as flags EXATAS de cada hardware alvo e prova, de
# verdade, que o binário roda (incluindo uma inferência real com um modelo
# minúsculo). É o "GitHub compila o sistema".
#
# Disparo: manual (workflow_dispatch), tags (v*) e semanal.
# Não roda em todo push de propósito: um build leva vários minutos.
on:
  workflow_dispatch:
    inputs:
      llama_ref:
        description: "Ref (tag/branch/commit) do llama.cpp"
        required: false
        default: master
        type: string
  push:
    tags: ["v*"]
  schedule:
    # Toda segunda-feira às 04:00 UTC — pega regressões do upstream.
    - cron: "0 4 * * 1"

permissions:
  contents: write

concurrency:
  group: build-llama-${{ github.ref }}
  cancel-in-progress: false

env:
  # Padrão robusto: `github.event.inputs` existe no workflow_dispatch e é null
  # nos demais eventos (push/schedule), caindo no fallback 'master'.
  LLAMA_REF: ${{ github.event.inputs.llama_ref || 'master' }}

jobs:
  build:
    name: Compilar (${{ matrix.family }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: intel-haswell
            desc: "Haswell-EP (Xeon E5 v3): AVX2/FMA/F16C — sem AVX-512"
          - family: intel-broadwell
            desc: "Broadwell-EP (Xeon E5 v4): AVX2/FMA/F16C — sem AVX-512"
          - family: intel-skylake-avx512
            desc: "Skylake-SP (Xeon Scalable v5): AVX-512 auto (liga no cross-build via família)"
          - family: intel-cascadelake-sp
            desc: "Cascade Lake-SP (v6): cascadelake + AVX-512/VNNI auto"
          - family: intel-icelake-sp
            desc: "Ice Lake-SP (v7): icelake-server + AVX-512 auto"
          - family: intel-sapphirerapids-sp
            desc: "Sapphire Rapids (v8): sapphirerapids + AVX-512/AMX auto"
          - family: intel-emeraldrapids-sp
            desc: "Emerald Rapids (v9): emeraldrapids + AVX-512/AMX auto"
          - family: intel-graniterapids-sp
            desc: "Granite Rapids (Xeon 6 P): graniterapids (GCC>=14; senão fallback sapphirerapids)"
          - family: amd-zen1
            desc: "Zen/Zen+ (Ryzen 1000/2000): AVX2/FMA/F16C — sem AVX-512"
          - family: amd-zen2
            desc: "Zen 2 (Ryzen 3000): AVX2/FMA/F16C — sem AVX-512"
          - family: amd-zen3
            desc: "Zen 3 (Ryzen 5000): znver3 — exige GCC >= 11"
          - family: amd-zen4
            desc: "Zen 4 (Ryzen 7000/EPYC Genoa): znver4 + AVX-512 auto — exige GCC >= 13"
          - family: amd-zen5
            desc: "Zen 5 (Ryzen 9000/EPYC Turin): znver5 + AVX-512 auto (GCC>=14; senão fallback znver4)"
    steps:
      - uses: actions/checkout@v7

      - name: Info do alvo
        run: |
          echo "Família: ${{ matrix.family }} — ${{ matrix.desc }}"
          echo "llama.cpp ref: ${LLAMA_REF}"
          echo "--- CPU do runner (só informativo) ---"
          lscpu | grep -E 'Model name|Flags' | head -2 || true

      - name: Dependências de build
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake git pkg-config libopenblas-dev

      # Baixa a FONTE como tarball ANTES de compilar, para exercitar o caminho
      # OFFLINE (`--source`) com cmake de verdade, nas 7 famílias. É o mesmo
      # caminho do 1º boot da ISO air-gapped — incluindo a extração e o
      # tratamento do diretório de topo do tarball do GitHub, que é onde mora o
      # risco. Se o download falhar, cai no clone (`--ref`) e o job continua:
      # o objetivo aqui é PROVAR, não depender da rede para passar.
      - name: Baixar a fonte do llama.cpp (tarball)
        id: src
        run: |
          set -euo pipefail
          url="https://github.com/ggml-org/llama.cpp/archive/refs/heads/${LLAMA_REF}.tar.gz"
          if curl -fsSL --retry 3 -o "$RUNNER_TEMP/llama-src.tar.gz" "$url"; then
            echo "tarball=$RUNNER_TEMP/llama-src.tar.gz" >> "$GITHUB_OUTPUT"
            echo "Escopo: tarball local (caminho offline/air-gapped)"
            ls -la "$RUNNER_TEMP/llama-src.tar.gz"
          else
            echo "tarball=" >> "$GITHUB_OUTPUT"
            echo "::warning::tarball indisponível para '${LLAMA_REF}'; caindo no clone (--ref)"
          fi

      # Usa o PRÓPRIO script do projeto: valida ISA, decide flags e faz fallback.
      # --assume-family-isa = CROSS-BUILD: a ISA vem do family.conf, não do
      # runner. Sem isso, um runner com AVX-512 geraria binário que sofre SIGILL
      # nos alvos (E5 v3/v4 e Ryzen 3500X têm apenas AVX2).
      # Sem cache, para manter o build determinístico e reprodutível (filosofia
      # do projeto). O trigger é semanal/tag/manual, então o custo é aceitável.
      - name: Compilar via script do projeto
        run: |
          set -euo pipefail
          # --source e --ref são mutuamente exclusivos (o fonte local já define a
          # versão): escolhemos um dos dois conforme o download acima.
          if [ -n "${{ steps.src.outputs.tarball }}" ]; then
            origem=(--source "${{ steps.src.outputs.tarball }}")
          else
            origem=(--ref "$LLAMA_REF")
          fi
          bash llama-build.sh \
            --family "${{ matrix.family }}" \
            --assume-family-isa \
            --dir "$GITHUB_WORKSPACE/llama.cpp" \
            --jobs 4 \
            --yes \
            "${origem[@]}"

      - name: Verificar binários e execução (pega SIGILL cedo)
        run: |
          set -euo pipefail
          BIN="$GITHUB_WORKSPACE/llama.cpp/build/bin"
          ls -la "$BIN"
          for b in llama-server llama-cli llama-bench; do
            test -x "$BIN/$b" || { echo "::error::binário ausente: $b"; exit 1; }
          done
          "$BIN/llama-bench" --help > /dev/null
          echo "OK: binários compilados e executáveis nesta CPU."

      - name: Baixar modelo minúsculo de teste
        id: model
        run: |
          set -euo pipefail
          url="https://huggingface.co/ggml-org/models/resolve/main/tinyllamas/stories15M-q4_0.gguf"
          if curl -fsSL --retry 3 -o "$RUNNER_TEMP/tiny.gguf" "$url"; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
            ls -la "$RUNNER_TEMP/tiny.gguf"
          else
            echo "::warning::modelo de teste indisponível (link pode ter mudado); pulando inferência real"
            echo "ok=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Inferência real (prova fim-a-fim)
        if: steps.model.outputs.ok == '1'
        run: |
          set -euo pipefail
          BIN="$GITHUB_WORKSPACE/llama.cpp/build/bin"
          # Se as flags de ISA estivessem erradas, isto falharia com SIGILL.
          "$BIN/llama-bench" -m "$RUNNER_TEMP/tiny.gguf" -p 32 -n 16 -t 2

      - name: Empacotar artefato
        run: |
          set -euo pipefail
          safe_ref="${GITHUB_REF_NAME//\//-}"
          name="ai-cpu-os-llama-${{ matrix.family }}-${safe_ref}"
          mkdir -p "dist/${name}"
          cp -r llama.cpp/build/bin "dist/${name}/bin"
          cp README.md "dist/${name}/README.md"
          [[ -f llama.cpp/LICENSE ]] && cp llama.cpp/LICENSE "dist/${name}/LICENSE" || true
          {
            echo "ai-cpu-os — binários do llama.cpp (família ${{ matrix.family }})"
            echo "llama.cpp ref: ${LLAMA_REF}"
            if [ -n "${{ steps.src.outputs.tarball }}" ]; then
              echo "origem do fonte: tarball local (--source)"
            else
              echo "origem do fonte: clone (--ref)"
            fi
            echo "commit: ${GITHUB_SHA}"
            echo "Flags: ${{ matrix.desc }}"
            echo
            echo "Uso: ./bin/llama-server -m /caminho/modelo.gguf --threads N"
          } > "dist/${name}/INFO.txt"
          tar -czf "dist/${name}.tar.gz" -C dist "${name}"
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: ai-cpu-os-llama-${{ matrix.family }}
          path: dist/*.tar.gz
          retention-days: 14

      # Em tags, anexa os binários à Release usando o gh CLI (sem actions de
      # terceiros, para reduzir a superfície de confiança da cadeia de build).
      - name: Publicar na Release (apenas em tags)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" \
              --title "ai-cpu-os ${tag}" \
              --generate-notes
          fi
          gh release upload "$tag" dist/*.tar.gz --clobber
          echo "Artefatos publicados na Release ${tag}."
