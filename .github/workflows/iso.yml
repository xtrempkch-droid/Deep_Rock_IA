name: iso

# Gera a ISO de instalação do ai-cpu-os a partir da ISO oficial do SO base.
#
# Base padrão: **Ubuntu Server live** + autoinstall (Subiquity). A remasterização
# Debian (netinst + preseed) continua disponível em `--distro debian`.
#
# Disparo: manual (workflow_dispatch) e em tags (v*) — igual ao build-llama,
# porque baixar a ISO base (~2,6 GB no Ubuntu) + remasterizar leva minutos e
# queimaria a cota de CI a cada push.
#
# O artefato servido aqui é uma **prova de que o caminho da ISO funciona** e uma
# ISO genérica para uso em VM (o disco do autoinstall é /dev/vda, que existe em
# VMs com virtio). Para instalar em hardware real, regenere localmente com
# `--disk` apontando para o SEU disco — ver docs/ISO.md.
on:
  workflow_dispatch:
    inputs:
      distro:
        description: "Base do SO"
        required: false
        default: ubuntu
        type: choice
        options: [ubuntu, debian]
      role:
        description: "Papel gravado na ISO (auto = detecta no hardware real)"
        required: false
        default: auto
        type: choice
        options: [auto, inference, builder]
      family:
        description: "Família gravada na ISO (auto = detecta no hardware real)"
        required: false
        default: auto
        type: string
      disk:
        description: "Disco do autoinstall (APENAS gravado na ISO; em VM virtio é /dev/vda)"
        required: false
        default: /dev/vda
        type: string
      air_gapped:
        description: "Embutir fonte + modelo + repo (ISO que se basta; MUITO mais lenta)"
        required: false
        default: false
        type: boolean
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-iso:
    name: Gerar ISO (${{ inputs.distro || 'ubuntu' }} · ${{ inputs.role || 'auto' }})
    # ubuntu-24.04 (noble) FIXO, e não ubuntu-latest: o `--iso-repo auto` monta o
    # repositório a partir da release DESTA máquina, e a ISO base padrão é a
    # 24.04. Com ubuntu-latest o label muda sozinho (migra para Ubuntu 26 em
    # 2026-10-19) e o repositório deixaria de ser montado por um motivo invisível.
    runs-on: ubuntu-24.04
    env:
      ISO_DISTRO: ${{ inputs.distro || 'ubuntu' }}
      ISO_ROLE: ${{ inputs.role || 'auto' }}
      ISO_FAMILY: ${{ inputs.family || 'auto' }}
      ISO_DISK: ${{ inputs.disk || '/dev/vda' }}
      # 'auto' embute o payload (fonte do llama.cpp + modelo + repo apt);
      # 'none' gera a ISO leve, que e o padrao do CI.
      #
      # POR QUE O PADRAO DO CI E LEVE: o GitHub limita **2 GiB por arquivo
      # de Release** e a cota de artefatos e pequena. Uma ISO air-gapped
      # (~4-5 GB) nao cabe nesses dois canais -- ela e para ser gerada na
      # maquina do usuario. Com air_gapped=true o CI ainda prova o caminho
      # completo: o build roda o verify-iso.sh no fim e confere a corrente.
      ISO_PAYLOAD: ${{ inputs.air_gapped && 'auto' || 'none' }}
    steps:
      - uses: actions/checkout@v7

      - name: Instalar ferramentas de remasterização
        run: |
          sudo apt-get update -qq
          # xorriso -> remasterização (as duas distros)
          # No caminho ubuntu  NÃO são precisos: os setores de boot da ISO
          #   oficial são preservados via `xorriso -indev/-outdev -map`.
          # No caminho debian precisamos de:
          #   isolinux -> isohdpfx.bin (boot híbrido BIOS+EFI)
          #   mtools   -> patch do grub.cfg dentro da efi.img (boot UEFI)
          #
          # `openssl` NÃO é opcional: o build o usa para gerar o hash da senha
          # aleatória, e aborta sem ele ("openssl não encontrado"). Ele existe
          # no runner por acaso — descoberto ao reproduzir o build num container
          # `ubuntu:24.04` limpo. `gzip` (índice do repo apt) e `ca-certificates`
          # (curl HTTPS) entram pelo mesmo motivo: dependência implícita do
          # runner é dependência que some quando o runner muda.
          sudo apt-get install -y --no-install-recommends \
            xorriso isolinux mtools curl coreutils yamllint \
            openssl gzip ca-certificates
          xorriso --version | head -1

      - name: Lint e autoteste dos templates da ISO
        run: make iso-lint

      - name: Simulação (dry-run)
        run: |
          # O dry-run também recebe as flags do payload para EXERCITAR os
          # caminhos novos (validação de release, checagem dos pacotes, etc.)
          # sem baixar nada -- é o que pega regressão cedo.
          make iso-dry-run DISK="$ISO_DISK" DISTRO="$ISO_DISTRO" \
            ROLE="$ISO_ROLE" FAMILY="$ISO_FAMILY" \
            ISO_ARGS="--iso-source $ISO_PAYLOAD --iso-model $ISO_PAYLOAD --iso-repo $ISO_PAYLOAD"

      - name: Gerar a ISO
        run: |
          set -euo pipefail
          sudo bash iso/build-iso.sh \
            --distro "$ISO_DISTRO" \
            --disk "$ISO_DISK" \
            --role "$ISO_ROLE" \
            --family "$ISO_FAMILY" \
            --iso-source "$ISO_PAYLOAD" \
            --iso-model "$ISO_PAYLOAD" \
            --iso-repo "$ISO_PAYLOAD" \
            --yes \
            --out "$GITHUB_WORKSPACE/iso/out/ai-cpu-os-${ISO_DISTRO}.iso" \
          2>&1 | tee /tmp/iso-build.log

          iso="iso/out/ai-cpu-os-${ISO_DISTRO}.iso"
          test -f "$iso" || { echo "::error::ISO não foi gerada"; exit 1; }
          ls -la "$iso"
          sha256sum "$iso" | tee "$iso.sha256"

      - name: Tamanho da ISO (limite de 2 GiB — só para a Release)
        id: size
        if: always()
        run: |
          set -euo pipefail
          iso="iso/out/ai-cpu-os-${ISO_DISTRO}.iso"
          # ATENÇÃO: o limite de 2 GiB vale para ASSET DE RELEASE, não para
          # ARTIFACT. A primeira versão desta checagem derivava o artifact do
          # mesmo booleano, e o resultado era cruel: a ISO air-gapped (~4 GB)
          # era gerada e DEPOIS descartada — o usuário sem `xorriso` não tinha
          # como obtê-la. Hoje só a Release é gateada; o artifact sobe sempre.
          # (Fonte: README do actions/upload-artifact — os limites documentados
          # para artifacts são número por job e perda de permissões; o de 2 GiB
          # é de Release assets.)
          if [ ! -f "$iso" ]; then
            echo "release_too_big=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bytes=$(stat -c %s "$iso")
          mb=$(( bytes / 1024 / 1024 ))
          # 2 GiB = 2147483648 bytes. O GitHub recusa arquivo de Release
          # acima disso, e o upload falharia DEPOIS de 10+ minutos de build.
          if [ "$bytes" -ge 2147483648 ]; then
            echo "release_too_big=true" >> "$GITHUB_OUTPUT"
            # ATENÇÃO: nada de string solta. A versão anterior quebrava a
            # mensagem no meio, e a segunda linha virava um COMANDO
            # inexistente -> `command not found` -> exit 127 -> o passo (e o
            # job) falhavam COM A ISO JÁ GERADA (run #15). O bug só aparecia
            # quando a ISO passava de 2 GiB, isto é, no caso air-gapped.
            # Montar em variável mantém cada linha curta (limite de 120 do
            # yamllint) SEM quebra de linha por `\`, que exigiria indentação e
            # quebraria o bloco YAML do `run: |`.
            msg="ISO com ${mb} MB: acima do limite de 2 GiB por arquivo de Release."
            msg+=" A Release e pulada, MAS O ARTIFACT SOBE (e baixavel)."
            echo "::warning::${msg}"
          else
            echo "release_too_big=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ISO com ${mb} MB: dentro do limite de 2 GiB da Release."
          fi

      - name: Relatório no resumo da execução
        if: always()
        run: |
          {
            echo "## ISO de instalação (ai-cpu-os)"
            echo
            echo "- Base do SO: \`$ISO_DISTRO\`"
            echo "- Papel gravado: \`$ISO_ROLE\` (\`auto\` = detecta o hardware no 1º boot)"
            echo "- Família gravada: \`$ISO_FAMILY\` (\`auto\` = detecta o hardware no 1º boot)"
            echo "- Disco do autoinstall: \`$ISO_DISK\`"
            echo "- Payload embutido (fonte/modelo/repo): \`$ISO_PAYLOAD\`"
            iso_file="iso/out/ai-cpu-os-${ISO_DISTRO}.iso"
            size="$( [ -f "$iso_file" ] && du -h "$iso_file" | cut -f1 || echo n/a )"
            echo "- Tamanho: \`$size\`"
            echo
            if [ -f "iso/out/ai-cpu-os-${ISO_DISTRO}.iso" ]; then
              echo "### Artefato"
              echo '```'
              ls -lh "iso/out/ai-cpu-os-${ISO_DISTRO}.iso"
              # O .sha256 e criado DEPOIS do build ter dado certo; se o build
              # falhou, o .iso existe mas o .sha256 nao — e este `cat` derrubava
              # o proprio passo de RELATORIO, escondendo a causa real (foi o que
              # aconteceu no run #6: dois passos vermelhos, e o segundo era eco).
              cat "iso/out/ai-cpu-os-${ISO_DISTRO}.iso.sha256" 2>/dev/null \
                || echo "(sha256 nao gerado — o build falhou antes)"
              echo '```'
            fi
            echo "### Avisos do build (WARN)"
            echo '```'
            grep -F '[WARN ]' /tmp/iso-build.log | tail -30 || echo "(nenhum)"
            echo '```'
            echo
            echo "⚠️ **Não valide a ISO em máquina real antes de bootá-la em VM.**"
            echo "Veja o Bloco M de \`docs/VALIDATION.md\`."
          } >> "$GITHUB_STEP_SUMMARY"

      # Diagnóstico em caso de falha. POR QUE existe: um build morreu com
      # `exit code 22` (críptico) e a causa só aparecia no log do job, que
      # exige token para ser lido — de fora do repositório era impossível
      # descobrir o motivo. Aqui os erros viram ANOTAÇÕES, que são públicas
      # e visíveis na aba Summary sem baixar nada.
      - name: Diagnóstico (apenas em falha)
        if: failure()
        run: |
          log=/tmp/iso-build.log
          # Padrão do que é "causa" num log do build. `[FAIL]` e `[erro]` estão
          # aqui porque o verify-iso.sh reprova com eles (run #10): na primeira
          # versão o grep só via `[ERROR]`, e a anotação que chegou foi só
          # "A ISO não passou na verificação" — o SINTOMA, sem dizer O QUÊ.
          # `Refazendo o download`/`Ainda faltando`/`falhou:` vêm da 2ª
          # tentativa do repositório apt: sem elas, a CAUSA (o que o apt
          # respondeu ao baixar) ficava só no log do job — que exige token e
          # por isso e ilegivel de fora. Foi assim no run #16: a anotacao dizia
          # "pacote ausente" de um pacote que existe.
          PAT='\[ERROR\]|\[FAIL\]|\[erro\]|FALHOU|Traceback|No such file|Refazendo o download|Ainda faltando|falhou:'
          {
            echo "## Diagnóstico do build da ISO"
            echo
            if [ ! -f "$log" ]; then
              echo "O build nao chegou a criar \`${log}\` (falhou antes de executar)."
            else
              echo "### Linhas de ERRO/FAIL"
              echo '```'
              if grep -E "$PAT" "$log" >/tmp/iso-erros.txt 2>/dev/null; then
                cat /tmp/iso-erros.txt
              else
                echo "(nenhuma linha de erro reconhecida)"
              fi
              echo '```'
              echo
              echo "### Avisos (WARN) — dizem QUAL pacote/item falhou"
              echo '```'
              grep -F '[WARN ]' "$log" | tail -25 || echo "(nenhum)"
              echo '```'
              echo
              echo "### Últimas 40 linhas do log"
              echo '```'
              tail -40 "$log" || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # Anotação (pública, sem token): é o que se lê de fora do repositório.
          if [ -f "$log" ]; then
            while IFS= read -r linha; do
              [ -n "$linha" ] || continue
              echo "::error::${linha}"
            done < <(grep -E "$PAT" "$log" 2>/dev/null | tail -12 || true)
          fi
          exit 0

      - uses: actions/upload-artifact@v7
        # SOBE SEMPRE — inclusive a ISO air-gapped de ~4 GB. Para quem nao tem
        # `xorriso` na maquina (a maioria), o artifact e o UNICO caminho para
        # obter o arquivo: baixa pelo navegador, confere com `make iso-check`
        # e grava com `make pendrive`. O limite de 2 GiB e da Release, nao do
        # artifact (ver o passo anterior).
        with:
          name: ai-cpu-os-iso-${{ env.ISO_DISTRO }}
          path: |
            iso/out/*.iso
            iso/out/*.iso.sha256
          retention-days: 7
          compression-level: 0   # já é uma ISO comprimida

      - name: Anexar à Release (apenas em tags)
        if: startsWith(github.ref, 'refs/tags/') && steps.size.outputs.release_too_big != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "ai-cpu-os ${tag}" --generate-notes
          fi
          gh release upload "$tag" iso/out/*.iso iso/out/*.iso.sha256 --clobber
          echo "ISO anexada à Release ${tag}."
