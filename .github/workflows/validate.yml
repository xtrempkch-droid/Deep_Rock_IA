name: validate

# Validação rápida em todo push/PR: lint de scripts, dry-run dos perfis e
# guarda-corpo das regras do projeto (ver AGENTS.md e docs/CI.md).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Lint: sintaxe bash, shellcheck, compilação Python e yamllint.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (bash, shellcheck, python, yaml)
    # ubuntu-24.04 FIXO: este job roda o dry-run da ISO, e o `--iso-repo auto`
    # compara a release DESTA máquina com a da ISO base (24.04). Em ubuntu-latest
    # o label muda sozinho (migra para Ubuntu 26 em 2026-10-19) e o resultado
    # passaria a depender do ambiente.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Instalar ferramentas de lint
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck yamllint

      - name: Coletar scripts
        id: scripts
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -name '*.sh' -not -path './.git/*' | sort)
          printf 'Encontrados %d scripts:\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          {
            echo "list<<EOF"
            printf '%s\n' "${files[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: bash -n (sintaxe)
        env:
          SCRIPTS: ${{ steps.scripts.outputs.list }}
        run: |
          set -euo pipefail
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            bash -n "$f"
          done <<< "$SCRIPTS"
          echo "Sintaxe OK."

      - name: shellcheck (severidade warning+)
        env:
          SCRIPTS: ${{ steps.scripts.outputs.list }}
        run: |
          set -euo pipefail
          mapfile -t files <<< "$SCRIPTS"
          shellcheck -x -S warning "${files[@]}"
          echo "shellcheck OK."

      - name: Python (compilação)
        run: |
          set -euo pipefail
          python3 -m compileall -q roles/
          echo "Python OK."
      - name: YAML (yamllint)
        run: |
          set -euo pipefail
          yamllint -c .yamllint.yml .github/ docker/ roles/
          echo "YAML OK."

      # O casamento CPU → família é o único jeito de exercitar Zen 3/Zen 4 sem
      # ter o hardware: o corpus tem modelos reais e a MESMA função que o build
      # usa. Já pegou 10 modelos mal atribuídos (todos os EPYC, entre eles).
      - name: Famílias (casamento CPU → família)
        run: |
          set -euo pipefail
          make families-test

      # A escolha da ISO oficial no SHA256SUMS. Existe porque a geração da ISO
      # Ubuntu morria com `exit code 22` do curl sem pista nenhuma: o
      # SHA256SUMS do Ubuntu marca o modo binário com `*` e lista TODAS as
      # point releases. As fixtures são cópias fiéis dos arquivos oficiais.
      - name: ISO (escolha da ISO oficial no SHA256SUMS)
        run: |
          set -euo pipefail
          make iso-select-test

      # O download do repositório apt local (`--iso-repo`), com `apt-cache` e
      # `apt-get` SUBSTITUÍDOS por stubs. Existe porque o CI falhou com
      # "Pacote pedido está AUSENTE: gnupg/jq/git": `apt-get download a b c`
      # ABORTA O LOTE INTEIRO quando um dos nomes não tem candidato, e o
      # `|| true` engolia até 25 pacotes por lote. Sem rede, sem apt real.
      - name: ISO (repositório apt local — filtro e fallback)
        run: |
          set -euo pipefail
          make iso-repo-test

      # Prova que os guardas do próprio job REALMENTE derrubam o job, plantando
      # cada violacao numa COPIA temporaria. Existe porque SEIS guardas estavam
      # na forma `! grep`, que o `set -e` ignora quando o comando e invertido
      # com `!` — eles nunca derrubavam nada.
      - name: Guardas do CI (prova por violação plantada)
        run: |
          set -euo pipefail
          make ci-guards-test

      # O template do autoinstall NÃO é YAML válido enquanto tem @@TOKENS@@ (o
      # `@` é indicador reservado do YAML), então ele não entra no yamllint
      # acima. Este passo substitui os tokens e valida o YAML RESULTANTE —
      # que é o que de fato vai para a ISO.
      - name: ISO (lint + autoteste dos templates)
        run: |
          set -euo pipefail
          make iso-lint
          make iso-yaml

      # O build real da ISO só roda em manual/tag (baixa ~2,6 GB). O dry-run dos
      # DOIS caminhos é barato e prova que a orquestração não quebrou.
      - name: ISO (dry-run dos dois caminhos)
        # Usa o MESMO alvo do Makefile que o `make validate` roda localmente:
        # um só lugar para manter, e o que passa aqui passa lá (foi um comando
        # duplicado que deixou passar a regressão do --iso-repo auto).
        run: make iso-dry-run-both

  # ---------------------------------------------------------------------------
  # Dry-run: prova que a orquestração funciona nos dois papéis sem alterar nada.
  # ---------------------------------------------------------------------------
  dry-run:
    name: Dry-run (papel ${{ matrix.role }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        role: [inference, builder]
    steps:
      - uses: actions/checkout@v7

      - name: Tornar scripts executáveis
        run: |
          set -euo pipefail
          chmod +x build.sh detect-hardware.sh llama-build.sh \
                   mods/apply.sh mods/*/*.sh families/resolve.sh \
                   roles/*/*.sh roles/inference/shell-ia.py tests/*.sh \
                   iso/verify-iso.sh iso/test-vm.sh

      - name: detect-hardware.sh
        run: ./detect-hardware.sh

      - name: build.sh --dry-run (${{ matrix.role }})
        run: |
          set -euo pipefail
          sudo ./build.sh --role "${{ matrix.role }}" \
               --dry-run --yes --skip-tests

      - name: smoke-test.sh --dry-run
        run: |
          set -euo pipefail
          bash tests/smoke-test.sh --dry-run --role "${{ matrix.role }}"

  # ---------------------------------------------------------------------------
  # Guarda-corpo das regras do projeto (AGENTS.md).
  # Impede que alguém remova arquivos obrigatórios ou a diretriz do tutorial.
  # ---------------------------------------------------------------------------
  project-rules:
    name: Regras do projeto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Arquivos obrigatórios presentes
        run: |
          set -euo pipefail
          required=(
            README.md AGENTS.md LICENSE
            README.technical.md
            build.sh detect-hardware.sh
            docs/ROADMAP.md docs/ARCHITECTURE.md docs/STATE.md
            docs/HARDWARE.md docs/TUNING.md docs/TROUBLESHOOTING.md
            docs/TUTORIAL.md docs/CI.md docs/VALIDATION.md docs/ISO.md
            docs/JOURNAL.md
            iso/build-iso.sh iso/preseed/ai-cpu-os.cfg
            iso/preseed/late-command.sh iso/preseed/firstboot.sh
            iso/preseed/ai-cpu-os-firstboot.service
            iso/autoinstall/autoinstall.yaml
            iso/verify-iso.sh iso/test-vm.sh
            families/resolve.sh families/_base/family.conf
            families/intel-haswell/family.conf families/intel-broadwell/family.conf
            families/intel-skylake-avx512/family.conf families/generic/family.conf
            families/amd-zen1/family.conf families/amd-zen2/family.conf
            families/amd-zen3/family.conf families/amd-zen4/family.conf
            llama-build.sh mods/apply.sh mods/README.md
            mods/kernel-tuning/mod.conf mods/kernel-tuning/apply.sh mods/kernel-tuning/revert.sh
            mods/hugepages/mod.conf mods/hugepages/apply.sh mods/hugepages/revert.sh
            mods/governor/mod.conf mods/governor/apply.sh mods/governor/revert.sh
            mods/openblas-threads/mod.conf mods/openblas-threads/apply.sh mods/openblas-threads/revert.sh
            roles/inference/install.sh roles/inference/sysctl.conf
            roles/inference/shell-ia.py roles/inference/ai-server.service
            roles/builder/install.sh roles/builder/docker-setup.sh
            roles/builder/registry-setup.sh roles/builder/gitea-compose.yml
            roles/builder/build-runner.sh
            tests/smoke-test.sh
            tests/test-iso-selection.sh
            tests/test-iso-repo-filter.sh
            tests/test-ci-guards.sh
            tests/fixtures/SHA256SUMS.ubuntu-24.04
            tests/fixtures/SHA256SUMS.debian-13
            tests/fixtures/apt-cache-policy.txt
          )
          fail=0
          for f in "${required[@]}"; do
            if [[ ! -f "$f" ]]; then
              echo "::error file=$f::arquivo obrigatório ausente"
              fail=1
            fi
          done
          [[ $fail -eq 0 ]] || exit 1
          echo "OK: ${#required[@]} arquivos obrigatórios presentes."

      - name: Diretriz do tutorial (Regra 9 do AGENTS.md)
        run: |
          set -euo pipefail
          grep -q 'docs/TUTORIAL.md' AGENTS.md \
            || { echo "::error::AGENTS.md não referencia docs/TUTORIAL.md"; exit 1; }
          grep -qi 'marco' AGENTS.md \
            || { echo "::error::AGENTS.md perdeu a diretriz de tutorial por marco"; exit 1; }
          grep -q 'TUTORIAL' README.md \
            || { echo "::error::README.md não referencia o tutorial"; exit 1; }
          # O README do usuário final e o manual do mantenedor são públicos e
          # precisam continuar existindo e se referenciando (o usuário precisa
          # conseguir chegar nos detalhes técnicos).
          grep -q 'README.technical.md' README.md \
            || { echo "::error::README.md não aponta para o README.technical.md"; exit 1; }
          grep -q 'README.md' README.technical.md \
            || { echo "::error::README.technical.md não aponta de volta para o README.md"; exit 1; }
          grep -q 'make validate' README.technical.md \
            || { echo "::error::README.technical.md perdeu o fluxo de verificação local"; exit 1; }
          echo "Diretriz do tutorial OK."

      - name: Modo estrito (set -e / set -euo pipefail) em todos os scripts
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            if head -1 "$f" | grep -qE '^#!.*\bbash\b'; then
              grep -q 'set -euo pipefail' "$f" \
                || { echo "::error file=$f::$f (bash) não usa set -euo pipefail"; fail=1; }
            else
              # Script POSIX sh: o late-command.sh roda no debian-installer, cujo
              # /bin/sh é dash — 'set -o pipefail' não existe lá e quebraria a ISO.
              grep -qE '^set -eu' "$f" \
                || { echo "::error file=$f::$f (sh) não usa set -eu"; fail=1; }
            fi
          done < <(find . -name '*.sh' -not -path './.git/*' | sort)
          [[ $fail -eq 0 ]] || exit 1
          echo "OK: todos os scripts estão em modo estrito (bash: set -euo pipefail; sh: set -eu)."

      - name: Docs vivas — campos esperados
        run: |
          set -euo pipefail
          grep -q 'Próxima ação imediata' docs/STATE.md
          grep -q 'Última atualização' docs/STATE.md
          grep -q 'Concluído' docs/ROADMAP.md
          grep -q 'Em Progresso' docs/ROADMAP.md
          grep -q 'Métricas de performance' docs/STATE.md
          # O protocolo de testes deve continuar preenchível e cobrir o benchmark.
          grep -q '_(preencher)_' docs/VALIDATION.md
          grep -q 'Bloco F' docs/VALIDATION.md
          grep -q 'Template de relatório' docs/VALIDATION.md
          # A ISO é o entregável final: o AGENTS precisa dizer isso, e os
          # templates do preseed não podem perder os marcadores de substituição.
          grep -qi 'entregável final' AGENTS.md
          grep -q 'build-iso.sh' AGENTS.md
          grep -q '@@ROLE@@' iso/preseed/firstboot.sh
          grep -q '@@FAMILY@@' iso/preseed/late-command.sh
          grep -q 'late_command' iso/preseed/ai-cpu-os.cfg
          grep -q 'firstboot-pending' iso/preseed/firstboot.sh
          # A variante Ubuntu precisa do autoinstall na raiz da ISO e do
          # flag de distro no gerador; se isso sumir, a ISO volta a ser só Debian.
          grep -q '@@STORAGE_LAYOUT@@' iso/autoinstall/autoinstall.yaml
          grep -q 'autoinstall' iso/autoinstall/autoinstall.yaml
          grep -q 'ubuntu' iso/build-iso.sh
          grep -q -- '--distro' iso/build-iso.sh
          # As ferramentas de validação da ISO precisam continuar existindo e
          # conectadas: verificar sem bootar E bootar numa VM são etapas
          # diferentes e as duas têm de estar rastreáveis.
          grep -q -- '--iso' iso/verify-iso.sh
          grep -q -- '--dir' iso/verify-iso.sh
          grep -q 'qemu-system-x86_64' iso/test-vm.sh
          grep -q 'serial' iso/test-vm.sh
          grep -q 'verify-iso.sh' Makefile
          grep -q 'test-vm.sh' Makefile
          # GPU é opcional e nunca implícita: o caminho tem de existir e estar
          # documentado, mas sem auto-seleção de backend.
          grep -q -- '--gpu' llama-build.sh
          grep -q -- '--gpu-check' llama-build.sh
          grep -q 'docs/GPU.md' llama-build.sh
          grep -q 'GPU.md' AGENTS.md
          grep -q 'GPU' detect-hardware.sh
          # Guarda negativo na forma `if`, NUNCA na forma `! cmd`: com `set -e`
          # o bash IGNORA o status de um comando invertido com `!` (esta na doc
          # do `set`), entao `! grep ...` jamais derrubava este job. Descoberto
          # na marra: SEIS guardas negativos deste arquivo eram decorativos.
          if grep -q -- '--gpu auto' llama-build.sh; then
            echo "::error file=llama-build.sh::voltou o '--gpu auto': GPU tem de ser EXPLICITA (Regra 12-c)"
            exit 1
          fi
          # O teste do casamento CPU → família precisa continuar existindo:
          # é o único que exercita Zen 3/Zen 4 sem o hardware.
          grep -q 'families-matrix.txt' tests/test-families.sh
          grep -q 'families-test' Makefile
          # O caminho OFFLINE (--source) é o que permite compilar no 1º boot de
          # uma ISO air-gapped (Regra 13-b / docs/ISO.md § 3.1): se ele sumir,
          # a ISO volta a exigir rede. Não pode depender de git nem de clone.
          grep -q -- '--source' llama-build.sh
          grep -q 'prepare_source_local' llama-build.sh
          grep -q 'fonte LOCAL' llama-build.sh
          # O MODELO VAI NA MÍDIA (decisão: ISO air-gapped). Se algum elo
          # desaparecer, a ISO volta a precisar de rede no 1º boot — e o modo
          # de falha é silencioso (sobe sem modelo), então guardamos cada elo.
          grep -q -- '--iso-model' iso/build-iso.sh
          grep -q 'SUGGESTED_MODEL_URL' iso/build-iso.sh
          grep -q 'MODEL_FILE' iso/preseed/late-command.sh
          grep -q 'AI_MODEL_FILE' iso/preseed/firstboot.sh
          grep -q 'AI_MODEL_FILE' roles/inference/install.sh
          grep -q -- '--model-file' roles/inference/install.sh
          # O REPOSITÓRIO APT LOCAL na mídia é o último elo do air-gapped: sem
          # ele o alvo instala pacotes pela rede. Guardamos a geração do índice
          # e os dois pontos de ligação (autoinstall e preseed).
          grep -q -- '--iso-repo' iso/build-iso.sh
          grep -q 'expand_apt_local_block' iso/build-iso.sh
          grep -q 'dpkg-deb' iso/build-iso.sh
          grep -q 'apt-repo' iso/build-iso.sh
          grep -q '@@APT_LOCAL_SOURCES@@' iso/autoinstall/autoinstall.yaml
          grep -q '@@APT_LOCAL_PRESEED@@' iso/preseed/ai-cpu-os.cfg
          grep -q 'APT_REPO_PATH' iso/preseed/late-command.sh
          grep -q 'apt-repo' iso/verify-iso.sh
          # A FONTE do llama.cpp na midia e o que torna o 1o boot offline: e o
          # passo mais demorado e o unico que ainda clonaria do GitHub. Guardamos
          # a flag, a corrente (late-command -> firstboot -> llama-build) e o
          # caminho manual (build.sh --llama-source, porque sudo limpa o env).
          grep -q -- '--iso-source' iso/build-iso.sh
          grep -q 'llama-src' iso/preseed/late-command.sh
          grep -q 'LLAMA_SRC' iso/preseed/late-command.sh
          grep -q 'AI_LLAMA_SOURCE' iso/preseed/firstboot.sh
          grep -q 'AI_LLAMA_SOURCE' llama-build.sh
          grep -q -- '--llama-source' build.sh
          grep -q -- '--model-file' build.sh
          grep -q 'llama-src' iso/verify-iso.sh
          # O dry-run dos DOIS caminhos da ISO tem de ser um alvo do Makefile, e
          # o CI tem de CHAMAR esse alvo (e nao repetir o comando). Foi um
          # comando duplicado que deixou passar a regressao do --iso-repo auto:
          # o CI falhava e o `make validate` local passava.
          grep -q 'iso-dry-run-both' Makefile
          grep -q 'validate:.*iso-dry-run-both' Makefile
          grep -q 'make iso-dry-run-both' .github/workflows/validate.yml
          # A escolha da ISO oficial no SHA256SUMS. Mesmo trio do dry-run, pelo
          # MESMO motivo: a geracao da ISO Ubuntu morria com `exit code 22`
          # (404 do curl) porque o SHA256SUMS do Ubuntu marca o modo binario
          # com `*` e lista todas as point releases. As fixtures sao copias
          # fieis dos arquivos oficiais e precisam continuar existindo — uma
          # fixture inventada NAO pega esse bug.
          grep -q 'iso-select-test' Makefile
          grep -q 'validate:.*iso-select-test' Makefile
          grep -q 'make iso-select-test' .github/workflows/validate.yml
          # Ancorado na DEFINICAO da funcao (`^nome()`) e nao no nome solto:
          # `grep 'normalize_iso_name'` tambem casa `normalize_iso_name_velho`,
          # entao renomear a funcao passaria batido. Testado com caso positivo.
          grep -q '^pick_iso_entry()' iso/build-iso.sh
          grep -q '^normalize_iso_name()' iso/build-iso.sh
          # O filtro de candidatos e o fallback um-a-um do download do repo
          # apt. O `-n 25` sozinho (ou `|| true` cru) e o que perdia 25
          # pacotes por lote em silencio — nao pode voltar.
          grep -q '^packages_with_candidate()' iso/build-iso.sh
          grep -q 'iso-repo-test' Makefile
          grep -q 'validate:.*iso-repo-test' Makefile
          grep -q 'make iso-repo-test' .github/workflows/validate.yml
          grep -q 'ci-guards-test' Makefile
          grep -q 'validate:.*ci-guards-test' Makefile
          grep -q 'make ci-guards-test' .github/workflows/validate.yml
          if grep -q 'xargs -r -n 25' iso/build-iso.sh; then
            echo "::error file=iso/build-iso.sh::lote sem fallback: um nome ruim perde 25 pacotes"
            exit 1
          fi
          # A fixture PRECISA manter o marcador binario `*` — e ele que
          # reproduz o 404. `-F` para deixar explicito que e texto literal
          # (em BRE o `*` so e especial depois de um atomo, mas um leitor
          # futuro pode "corrigir" o que ja esta certo).
          grep -qF '*ubuntu-24.04.5-live-server-amd64.iso' tests/fixtures/SHA256SUMS.ubuntu-24.04
          # Versoes de actions alinhadas: o iso.yml ficou preso em @v4 enquanto
          # o resto do repo ja estava em @v6/@v7 (o bump do Dependabot nao o
          # alcancou). Nada de actions/* em major antigo.
          if grep -qE 'uses: actions/[a-z-]+@v[1-4]$' .github/workflows/*.yml; then
            echo "::error::actions/* em major antigo (@v1..@v4) — alinhe com o resto do repo"
            exit 1
          fi
          # `upload-artifact` fixado no v7: o repo padronizou nele (runtime
          # node24; o v7 e ADITIVO — novo parametro OPCIONAL `archive:false`
          # para upload direto de arquivo unico, default `name:`/`path:`
          # intacto). Sobrou um @v6 no main porque o PR #3 do Dependabot
          # trazia o bump e eu alinhei o iso.yml copiando o major vizinho.
          #
          # Guarda NEGATIVO (nao pode voltar para @v1..@v6) + POSITIVO. O
          # positivo e POR ARQUIVO de proposito: contar `*.yml` incluiria este
          # proprio validate.yml, que CITA a string dentro do comando — a
          # contagem ficaria inflada e a perda de UM dos dois passaria.
          if grep -qE 'actions/upload-artifact@v[1-6]' .github/workflows/*.yml; then
            echo "::error::upload-artifact abaixo do v7 — o repo padronizou no v7 (runtime node24)"
            exit 1
          fi
          grep -q 'uses: actions/upload-artifact@v7' .github/workflows/build-llama.yml
          grep -q 'uses: actions/upload-artifact@v7' .github/workflows/iso.yml
          # E o atalho proibido continua proibido: nunca embutir binário
          # pré-compilado do llama.cpp (exigiria 1 ISO por família).
          if grep -q -- '--prebuilt' iso/build-iso.sh; then
            echo "::error file=iso/build-iso.sh::'--prebuilt' volta a ser proibido (Regra 13-b)"
            exit 1
          fi
          # Instrução COPY de verdade (o Dockerfile CITA esse comando num
          # comentário didático — por isso ancoramos no início da linha).
          if grep -qE '^COPY[[:space:]]+.*build/bin' docker/Dockerfile; then
            echo "::error file=docker/Dockerfile::COPY build/bin (RPATH -> exit 127): use cmake --install"
            exit 1
          fi
          # META-GUARDA: proibe a forma que NAO derruba o job.
          if grep -nE '^[[:space:]]*! ' .github/workflows/*.yml; then
            echo "::error::guarda na forma '! cmd' nao derruba o job (set -e ignora cmd invertido)"
            exit 1
          fi
          # O diário de continuidade é o que permite retomar sem perder nada
          # (Regra 14): precisa continuar existindo e com as seções-chave.
          grep -qi 'retomada em 5 minutos' docs/JOURNAL.md
          grep -q 'Threads abertas' docs/JOURNAL.md
          grep -q 'Armadilhas já pisadas' docs/JOURNAL.md
          grep -q 'Como registrar uma nova sessão' docs/JOURNAL.md
          grep -q 'docs/JOURNAL.md' AGENTS.md
          echo "Docs vivas OK."
