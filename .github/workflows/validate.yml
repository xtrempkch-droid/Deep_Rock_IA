name: validate

# Validação rápida em todo push/PR: lint de scripts, dry-run dos perfis e
# guarda-corpo das regras do projeto (ver AGENTS.md e docs/CI.md).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Lint: sintaxe bash, shellcheck, compilação Python e yamllint.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (bash, shellcheck, python, yaml)
    # ubuntu-24.04 FIXO: este job roda o dry-run da ISO, e o `--iso-repo auto`
    # compara a release DESTA máquina com a da ISO base (24.04). Em ubuntu-latest
    # o label muda sozinho (migra para Ubuntu 26 em 2026-10-19) e o resultado
    # passaria a depender do ambiente.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Instalar ferramentas de lint
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck yamllint

      - name: Coletar scripts
        id: scripts
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -name '*.sh' -not -path './.git/*' | sort)
          printf 'Encontrados %d scripts:\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          {
            echo "list<<EOF"
            printf '%s\n' "${files[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: bash -n (sintaxe)
        env:
          SCRIPTS: ${{ steps.scripts.outputs.list }}
        run: |
          set -euo pipefail
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            bash -n "$f"
          done <<< "$SCRIPTS"
          echo "Sintaxe OK."

      - name: shellcheck (severidade warning+)
        env:
          SCRIPTS: ${{ steps.scripts.outputs.list }}
        run: |
          set -euo pipefail
          mapfile -t files <<< "$SCRIPTS"
          shellcheck -x -S warning "${files[@]}"
          echo "shellcheck OK."

      - name: Python (compilação)
        run: |
          set -euo pipefail
          python3 -m compileall -q roles/
          echo "Python OK."
      - name: YAML (yamllint)
        run: |
          set -euo pipefail
          yamllint -c .yamllint.yml .github/ docker/ roles/
          echo "YAML OK."

      # O casamento CPU → família é o único jeito de exercitar Zen 3/Zen 4 sem
      # ter o hardware: o corpus tem modelos reais e a MESMA função que o build
      # usa. Já pegou 10 modelos mal atribuídos (todos os EPYC, entre eles).
      - name: Famílias (casamento CPU → família)
        run: |
          set -euo pipefail
          make families-test

      # A política de AVX-512 (`never`/`optin`/`auto`) de cada família. Nasceu de
      # um bug real: uma família AVX2 com AVX-512 ligado gera SIGILL no alvo, e
      # uma família com AVX-512 desligada perde desempenho em silêncio. O teste
      # exercita o comportamento de verdade (cross-build) e agora cobre as 14
      # famílias — não só as 8 da era em que foi escrito.
      - name: "AVX-512 (política das famílias: never/optin/auto)"
        run: |
          set -euo pipefail
          make avx512-test

      # A escolha da ISO oficial no SHA256SUMS. Existe porque a geração da ISO
      # Ubuntu morria com `exit code 22` do curl sem pista nenhuma: o
      # SHA256SUMS do Ubuntu marca o modo binário com `*` e lista TODAS as
      # point releases. As fixtures são cópias fiéis dos arquivos oficiais.
      - name: ISO (escolha da ISO oficial no SHA256SUMS)
        run: |
          set -euo pipefail
          make iso-select-test

      # O download do repositório apt local (`--iso-repo`), com `apt-cache` e
      # `apt-get` SUBSTITUÍDOS por stubs. Existe porque o CI falhou com
      # "Pacote pedido está AUSENTE: gnupg/jq/git": `apt-get download a b c`
      # ABORTA O LOTE INTEIRO quando um dos nomes não tem candidato, e o
      # `|| true` engolia até 25 pacotes por lote. Sem rede, sem apt real.
      - name: ISO (repositório apt local — filtro e fallback)
        run: |
          set -euo pipefail
          make iso-repo-test

      # O verificador da ISO confere o CONTEUDO (nao boota) e agora tem uma
      # base so. O teste cobre as falhas que ele tem de pegar e a recusa
      # explicita do caminho Debian (ADR-001).
      - name: "ISO (verificador de conteudo: autoinstall, uma base so)"
        run: |
          set -euo pipefail
          make iso-verify-test
      # O `iso/check-iso.sh` existe para quem NAO tem xorriso (a maquina do
      # dono e assim): confere uma ISO BAIXADA com dd/od/sha256sum. As fixtures
      # cobrem os modos de falha reais, inclusive o mais comum de todos: o
      # navegador entregar o ARTIFACT (zip) em vez do .iso.
      - name: ISO (conferencia de ISO baixada, sem xorriso)
        run: |
          set -euo pipefail
          make iso-check-test
      # O gravador de pendrive é o passo mais PERIGOSO do projeto (`dd` num
      # dispositivo). As travas que impedem apontar para o disco errado são
      # testadas aqui, sem root, sem device e sem escrever nada.
      - name: Pendrive (travas de segurança do gravador)
        run: |
          set -euo pipefail
          make pendrive-test

      # A interface web é o caminho amigável para quem não quer decorar flags.
      # O teste sobe o servidor de verdade numa porta livre e prova o essencial:
      # a lista fechada de ações (nada de comando arbitrário), os validadores
      # de entrada, a recusa EXPLICATIVA quando falta `xorriso`, a ausência de
      # qualquer rota de escrita e o bind em 127.0.0.1. Sem navegador, sem rede
      # e sem dependência de terceiros (o server é só biblioteca padrão).
      - name: Interface web (API + salvaguardas)
        run: |
          set -euo pipefail
          make ui-test

      # A página é JavaScript: o `ui-test` exercita a API e NÃO o script. Um
      # erro no topo do <script> (ex.: ler dado que só existe depois do fetch)
      # mata a página inteira e deixa o `ui-test` verde. Este passo executa o
      # JS num DOM falso e confere o que ele FEZ. Sem node: SKIP.
      - name: "Interface web (executa o JS da página num DOM falso)"
        run: |
          set -euo pipefail
          make ui-page-test

      # O contrato do ai-talk (§6.7/§6.8 do docs/CHAT.md) provado em loopback:
      # espaçamento de 50 ms por par, hello isento, fila com exit 5, dedupe,
      # assinatura por nó e `ECONNREFUSED` em fail fast. Sem rede externa, sem
      # root e sem dependência fora da stdlib.
      - name: "ai-talk (chat da frota: contrato em loopback)"
        run: |
          set -euo pipefail
          make talk-test

      # O INSTALADOR do chat (talk/install.sh) e o elo que transforma "existe um
      # daemon" em "a maquina tem o servico". Ele roda com --root: escreve num
      # diretorio temporario, sem useradd/systemctl. Os dois modos de falha que
      # ele existe para impedir sao silenciosos: subir SEM chave e a chave por
      # no nao entrar na config (o no cairia na chave global).
      - name: "ai-talk (instalador: config, chaves e unit; sem root)"
        run: |
          set -euo pipefail
          make talk-install-test

      # O CHAT DENTRO DA ISO: --chat-*, payload na midia (0640), os tres elos
      # (late-command -> .iso-config -> firstboot -> build.sh etapa 2.5) e o
      # teto de 15 nos. Sem gerar ISO: --dry-run e --check-templates.
      - name: "ai-talk (chat dentro da ISO: payload e elos)"
        run: |
          set -euo pipefail
          make iso-chat-test

      # A trava de instância única do gerador de ISO, provada com `flock` de
      # verdade (dois processos). Existe porque um sintoma real ("mv: cannot
      # stat … .part") veio de DOIS builds ao mesmo tempo no mesmo --work-dir:
      # um renomeia o `.part` enquanto o outro ainda escreve nele. Sem teste,
      # a trava poderia ser removida numa refatoração sem ninguém reclamar.
      - name: ISO (trava de instância única do gerador)
        run: |
          set -euo pipefail
          make iso-lock-test

      # O modo nº 1 de a instalação automática NÃO acontecer: o autoinstall
      # fixa um disco que o alvo não tem (`match: {path: /dev/vda}`), nenhum
      # disco casa e o Subiquity para sem erro visível. Pior: a mitigação
      # documentada (`--disk auto`) gerava `match: {path: auto}` — quebrada.
      - name: "ISO (disco do autoinstall: auto x fixado x inválido)"
        run: |
          set -euo pipefail
          make iso-disk-test

      # ADR-002: a identidade segue a FUNCAO da maquina (inference -> ai-inference,
      # builder -> ai-builder). Errar isso e' silencioso: a ISO instala, o alvo
      # sobe e o usuario e' outro — so se descobre ao tentar `ssh`.
      - name: "ISO (identidade derivada do papel: ADR-002)"
        run: |
          set -euo pipefail
          make identity-test

      # `--iso-repo auto` e o que torna a ISO auto-suficiente (leva os .deb,
      # inclusive openssh-server). Isso so' vale se a conferencia de RELEASE
      # funcionar: com --iso o codename/versao tem de sair do ARQUIVO.
      - name: "ISO (release do --iso-repo auto, com ISOs falsas)"
        run: |
          set -euo pipefail
          make iso-release-test

      # O verificador extrai arquivos da ISO; um modelo de 1 GB enchia o /tmp
      # (tmpfs) e a verificacao passava a reprovar uma ISO CORRETA. Este teste
      # usa um modelo ESPARSO de 2 GB e prova que ele nao e copiado inteiro.
      - name: "ISO (verificador × espaço em disco: modelo de 2 GB)"
        run: |
          set -euo pipefail
          make iso-space-test

      # As mods de REPARO existem para consertar uma maquina que ja esta no
      # chao (rede sem IP / apt sem repositorio). Um erro nelas tem o pior modo
      # de falha possivel, entao cada uma e provada numa ARVORE FALSA, sem root
      # e sem tocar no sistema que roda o CI.
      - name: "Mods de reparo (network + apt-sources; árvore falsa)"
        run: |
          set -euo pipefail
          make network-test
          make apt-test

      # Prova que os guardas do próprio job REALMENTE derrubam o job, plantando
      # cada violacao numa COPIA temporaria. Existe porque SEIS guardas estavam
      # na forma `! grep`, que o `set -e` ignora quando o comando e invertido
      # com `!` — eles nunca derrubavam nada.
      - name: Guardas do CI (prova por violação plantada)
        run: |
          set -euo pipefail
          make ci-guards-test

      # O template do autoinstall NÃO é YAML válido enquanto tem @@TOKENS@@ (o
      # `@` é indicador reservado do YAML), então ele não entra no yamllint
      # acima. Este passo substitui os tokens e valida o YAML RESULTANTE —
      # que é o que de fato vai para a ISO.
      - name: ISO (lint + autoteste dos templates)
        run: |
          set -euo pipefail
          make iso-lint
          make iso-yaml

      # O build real da ISO só roda em manual/tag (baixa ~2,6 GB). O dry-run dos
      # DOIS caminhos é barato e prova que a orquestração não quebrou.
      - name: ISO (dry-run dos dois caminhos)
        # Usa o MESMO alvo do Makefile que o `make validate` roda localmente:
        # um só lugar para manter, e o que passa aqui passa lá (foi um comando
        # duplicado que deixou passar a regressão do --iso-repo auto).
        run: make iso-dry-run

  # ---------------------------------------------------------------------------
  # Dry-run: prova que a orquestração funciona nos dois papéis sem alterar nada.
  # ---------------------------------------------------------------------------
  dry-run:
    name: Dry-run (papel ${{ matrix.role }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        role: [inference, builder]
    steps:
      - uses: actions/checkout@v7

      - name: Tornar scripts executáveis
        run: |
          set -euo pipefail
          chmod +x build.sh detect-hardware.sh llama-build.sh \
                   mods/apply.sh mods/*/*.sh families/resolve.sh \
                   roles/*/*.sh roles/inference/shell-ia.py tests/*.sh \
                   iso/verify-iso.sh iso/test-vm.sh iso/write-pendrive.sh \
                   iso/check-iso.sh

      - name: detect-hardware.sh
        run: ./detect-hardware.sh

      - name: build.sh --dry-run (${{ matrix.role }})
        run: |
          set -euo pipefail
          sudo ./build.sh --role "${{ matrix.role }}" \
               --dry-run --yes --skip-tests

      - name: smoke-test.sh --dry-run
        run: |
          set -euo pipefail
          bash tests/smoke-test.sh --dry-run --role "${{ matrix.role }}"

  # ---------------------------------------------------------------------------
  # Guarda-corpo das regras do projeto (AGENTS.md).
  # Impede que alguém remova arquivos obrigatórios ou a diretriz do tutorial.
  # ---------------------------------------------------------------------------
  project-rules:
    name: Regras do projeto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Arquivos obrigatórios presentes
        run: |
          set -euo pipefail
          required=(
            README.md AGENTS.md LICENSE
            README.technical.md
            build.sh detect-hardware.sh
            docs/ROADMAP.md docs/ARCHITECTURE.md docs/STATE.md
            docs/HARDWARE.md docs/TUNING.md docs/TROUBLESHOOTING.md
            docs/TUTORIAL.md docs/CI.md docs/VALIDATION.md docs/ISO.md
            docs/JOURNAL.md
            docs/DECISIONS.md docs/CHAT.md
            docs/IMPLANTAR-EM-OUTRO-PC.md
            iso/build-iso.sh
            iso/common/late-command.sh iso/common/firstboot.sh
            iso/common/ai-cpu-os-firstboot.service
            iso/autoinstall/autoinstall.yaml
            iso/verify-iso.sh iso/test-vm.sh
            iso/write-pendrive.sh
            iso/check-iso.sh
            families/resolve.sh families/_base/family.conf
            families/intel-haswell/family.conf families/intel-broadwell/family.conf
            families/intel-skylake-avx512/family.conf families/generic/family.conf
            families/intel-cascadelake-sp/family.conf
            families/intel-icelake-sp/family.conf
            families/intel-sapphirerapids-sp/family.conf
            families/intel-emeraldrapids-sp/family.conf
            families/intel-graniterapids-sp/family.conf
            families/amd-zen1/family.conf families/amd-zen2/family.conf
            families/amd-zen3/family.conf families/amd-zen4/family.conf
            families/amd-zen5/family.conf
            llama-build.sh mods/apply.sh mods/README.md
            mods/kernel-tuning/mod.conf mods/kernel-tuning/apply.sh mods/kernel-tuning/revert.sh
            mods/hugepages/mod.conf mods/hugepages/apply.sh mods/hugepages/revert.sh
            mods/governor/mod.conf mods/governor/apply.sh mods/governor/revert.sh
            mods/openblas-threads/mod.conf mods/openblas-threads/apply.sh mods/openblas-threads/revert.sh
            mods/network/mod.conf mods/network/apply.sh mods/network/revert.sh
            mods/apt-sources/mod.conf mods/apt-sources/apply.sh mods/apt-sources/revert.sh
            roles/inference/install.sh roles/inference/sysctl.conf
            roles/inference/shell-ia.py roles/inference/ai-server.service
            roles/builder/install.sh roles/builder/docker-setup.sh
            roles/builder/registry-setup.sh roles/builder/gitea-compose.yml
            roles/builder/build-runner.sh
            tests/smoke-test.sh
            tests/test-iso-selection.sh
            tests/test-iso-repo-filter.sh
            tests/test-ci-guards.sh
            tests/test-verify-iso-repo.sh
            tests/test-write-pendrive.sh
            tests/test-check-iso.sh
            tests/test-webui.sh tests/test-webui-page.sh tests/test-network-mod.sh
            tests/test-avx512-policy.sh
            tests/test-iso-lock.sh
            tests/test-iso-disk.sh
            tests/test-role-identity.sh
            talk/ai_talk.py talk/install.sh talk/ai-talk.service
            tests/test-ai-talk.sh tests/test-ai-talk-install.sh
            tests/test-iso-chat.sh
            webui/server.py webui/index.html
            tests/fixtures/SHA256SUMS.ubuntu-24.04
            tests/fixtures/apt-cache-policy.txt
          )
          fail=0
          for f in "${required[@]}"; do
            if [[ ! -f "$f" ]]; then
              echo "::error file=$f::arquivo obrigatório ausente"
              fail=1
            fi
          done
          [[ $fail -eq 0 ]] || exit 1
          echo "OK: ${#required[@]} arquivos obrigatórios presentes."

      - name: Diretriz do tutorial (Regra 9 do AGENTS.md)
        run: |
          set -euo pipefail
          grep -q 'docs/TUTORIAL.md' AGENTS.md \
            || { echo "::error::AGENTS.md não referencia docs/TUTORIAL.md"; exit 1; }
          grep -qi 'marco' AGENTS.md \
            || { echo "::error::AGENTS.md perdeu a diretriz de tutorial por marco"; exit 1; }
          grep -q 'TUTORIAL' README.md \
            || { echo "::error::README.md não referencia o tutorial"; exit 1; }
          # O README do usuário final e o manual do mantenedor são públicos e
          # precisam continuar existindo e se referenciando (o usuário precisa
          # conseguir chegar nos detalhes técnicos).
          grep -q 'README.technical.md' README.md \
            || { echo "::error::README.md não aponta para o README.technical.md"; exit 1; }
          grep -q 'README.md' README.technical.md \
            || { echo "::error::README.technical.md não aponta de volta para o README.md"; exit 1; }
          grep -q 'make validate' README.technical.md \
            || { echo "::error::README.technical.md perdeu o fluxo de verificação local"; exit 1; }
          echo "Diretriz do tutorial OK."

      - name: Modo estrito (set -e / set -euo pipefail) em todos os scripts
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            if head -1 "$f" | grep -qE '^#!.*\bbash\b'; then
              grep -q 'set -euo pipefail' "$f" \
                || { echo "::error file=$f::$f (bash) não usa set -euo pipefail"; fail=1; }
            else
              # Script POSIX sh: o late-command.sh roda no debian-installer, cujo
              # /bin/sh é dash — 'set -o pipefail' não existe lá e quebraria a ISO.
              grep -qE '^set -eu' "$f" \
                || { echo "::error file=$f::$f (sh) não usa set -eu"; fail=1; }
            fi
          done < <(find . -name '*.sh' -not -path './.git/*' | sort)
          [[ $fail -eq 0 ]] || exit 1
          echo "OK: todos os scripts estão em modo estrito (bash: set -euo pipefail; sh: set -eu)."

      - name: Docs vivas — campos esperados
        run: |
          set -euo pipefail
          grep -q 'Próxima ação imediata' docs/STATE.md
          grep -q 'Última atualização' docs/STATE.md
          grep -q 'Concluído' docs/ROADMAP.md
          grep -q 'Em Progresso' docs/ROADMAP.md
          grep -q 'Métricas de performance' docs/STATE.md
          # O protocolo de testes deve continuar preenchível e cobrir o benchmark.
          grep -q '_(preencher)_' docs/VALIDATION.md
          grep -q 'Bloco F' docs/VALIDATION.md
          grep -q 'Template de relatório' docs/VALIDATION.md
          # A ISO é o entregável final e tem UMA base só (ADR-001).
          grep -qi 'entregável final' AGENTS.md
          grep -q 'build-iso.sh' AGENTS.md
          grep -q '@@ROLE@@' iso/common/firstboot.sh
          grep -q '@@FAMILY@@' iso/common/late-command.sh
          grep -qE '^late-commands:' iso/autoinstall/autoinstall.yaml
          grep -q 'ai-cpu-os-boot/late-command.sh' iso/autoinstall/autoinstall.yaml
          grep -q 'firstboot-pending' iso/common/firstboot.sh
          # A base é Ubuntu e só: autoinstall na raiz da ISO e `--distro`
          # aceitando exclusivamente `ubuntu`. Se `--distro debian` voltar a
          # funcionar sem passar pelo ADR-001, o projeto volta a ter duas ISOs.
          grep -q '@@STORAGE_LAYOUT@@' iso/autoinstall/autoinstall.yaml
          # BASE INSTALADA EXPLICITA: a ISO oficial oferece ubuntu-server
          # (default, com git/curl/gnupg) e ubuntu-server-minimal (sem eles).
          # Deixar no default = depender de uma escolha de terceiro.
          grep -qE '^source:$' iso/autoinstall/autoinstall.yaml
          grep -q '@@INSTALL_SOURCE@@' iso/autoinstall/autoinstall.yaml
          grep -q 'INSTALL_SOURCE="ubuntu-server"' iso/build-iso.sh
          # e o id pedido tem de existir no install-sources.yaml da ISO
          grep -q 'install-sources.yaml' iso/build-iso.sh
          grep -q 'Bases disponíveis' iso/build-iso.sh
          grep -q 'install-sources.yaml' iso/verify-iso.sh
          grep -q 'autoinstall' iso/autoinstall/autoinstall.yaml
          grep -q 'ubuntu' iso/build-iso.sh
          grep -q -- '--distro' iso/build-iso.sh
          # Recusar o Debian e uma decisao de arquitetura, nao um esquecimento:
          # o erro tem de citar o ADR-001 para quem chegar depois entender.
          grep -q 'ADR-001' iso/build-iso.sh
          if grep -q 'preseed/' iso/build-iso.sh; then
            echo "::error file=iso/build-iso.sh::o caminho Debian (preseed) foi removido pelo ADR-001"
            exit 1
          fi
          if [[ -d iso/preseed ]]; then
            echo "::error file=iso/preseed::diretorio Debian removido pelo ADR-001 voltou"
            exit 1
          fi
          # As ferramentas de validação da ISO precisam continuar existindo e
          # conectadas: verificar sem bootar E bootar numa VM são etapas
          # diferentes e as duas têm de estar rastreáveis.
          grep -q -- '--iso' iso/verify-iso.sh
          grep -q -- '--dir' iso/verify-iso.sh
          grep -q 'qemu-system-x86_64' iso/test-vm.sh
          grep -q 'serial' iso/test-vm.sh
          grep -q 'verify-iso.sh' Makefile
          grep -q 'test-vm.sh' Makefile
          # GPU é opcional e nunca implícita: o caminho tem de existir e estar
          # documentado, mas sem auto-seleção de backend.
          grep -q -- '--gpu' llama-build.sh
          grep -q -- '--gpu-check' llama-build.sh
          grep -q 'docs/GPU.md' llama-build.sh
          grep -q 'GPU.md' AGENTS.md
          grep -q 'GPU' detect-hardware.sh
          # Guarda negativo na forma `if`, NUNCA na forma `! cmd`: com `set -e`
          # o bash IGNORA o status de um comando invertido com `!` (esta na doc
          # do `set`), entao `! grep ...` jamais derrubava este job. Descoberto
          # na marra: SEIS guardas negativos deste arquivo eram decorativos.
          if grep -q -- '--gpu auto' llama-build.sh; then
            echo "::error file=llama-build.sh::voltou o '--gpu auto': GPU tem de ser EXPLICITA (Regra 12-c)"
            exit 1
          fi
          # O teste do casamento CPU → família precisa continuar existindo:
          # é o único que exercita Zen 3/Zen 4 sem o hardware.
          grep -q 'families-matrix.txt' tests/test-families.sh
          grep -q 'families-test' Makefile
          # O caminho OFFLINE (--source) é o que permite compilar no 1º boot de
          # uma ISO air-gapped (Regra 13-b / docs/ISO.md § 3.1): se ele sumir,
          # a ISO volta a exigir rede. Não pode depender de git nem de clone.
          grep -q -- '--source' llama-build.sh
          grep -q 'prepare_source_local' llama-build.sh
          grep -q 'fonte LOCAL' llama-build.sh
          # O MODELO VAI NA MÍDIA (decisão: ISO air-gapped). Se algum elo
          # desaparecer, a ISO volta a precisar de rede no 1º boot — e o modo
          # de falha é silencioso (sobe sem modelo), então guardamos cada elo.
          grep -q -- '--iso-model' iso/build-iso.sh
          grep -q 'SUGGESTED_MODEL_URL' iso/build-iso.sh
          grep -q 'MODEL_FILE' iso/common/late-command.sh
          grep -q 'AI_MODEL_FILE' iso/common/firstboot.sh
          grep -q 'AI_MODEL_FILE' roles/inference/install.sh
          grep -q -- '--model-file' roles/inference/install.sh
          # O REPOSITÓRIO APT LOCAL na mídia é o último elo do air-gapped: sem
          # ele o alvo instala pacotes pela rede. Guardamos a geração do índice
          # e o ponto de ligação (o autoinstall; o preseed saiu no ADR-001).
          grep -q -- '--iso-repo' iso/build-iso.sh
          grep -q 'expand_apt_local_block' iso/build-iso.sh
          grep -q 'dpkg-deb' iso/build-iso.sh
          grep -q 'apt-repo' iso/build-iso.sh
          grep -q '@@APT_LOCAL_SOURCES@@' iso/autoinstall/autoinstall.yaml
          grep -q 'APT_REPO_PATH' iso/common/late-command.sh
          grep -q 'apt-repo' iso/verify-iso.sh
          # A FONTE do llama.cpp na midia e o que torna o 1o boot offline: e o
          # passo mais demorado e o unico que ainda clonaria do GitHub. Guardamos
          # a flag, a corrente (late-command -> firstboot -> llama-build) e o
          # caminho manual (build.sh --llama-source, porque sudo limpa o env).
          grep -q -- '--iso-source' iso/build-iso.sh
          grep -q 'llama-src' iso/common/late-command.sh
          grep -q 'LLAMA_SRC' iso/common/late-command.sh
          grep -q 'AI_LLAMA_SOURCE' iso/common/firstboot.sh
          grep -q 'AI_LLAMA_SOURCE' llama-build.sh
          grep -q -- '--llama-source' build.sh
          grep -q -- '--model-file' build.sh
          grep -q 'llama-src' iso/verify-iso.sh
          # REDE DO ALVO: o Subiquity nao grava configuracao persistente quando
          # o autoinstall nao tem `network:`, e o sistema sobe com a placa DOWN
          # (bug real, sessao #28). O default tem de ser DHCP e os tres elos
          # (autoinstall -> netplan na midia -> late-command) tem de existir.
          grep -q '^NETWORK_MODE="auto"' iso/build-iso.sh
          if grep -q '^NETWORK_MODE="none"' iso/build-iso.sh; then
            echo "::error file=iso/build-iso.sh::default de rede voltou a 'none' (alvo subiria sem DHCP)"
            exit 1
          fi
          grep -q -- '--network' iso/build-iso.sh
          grep -q '^network_yaml_block()' iso/build-iso.sh
          grep -q '@@NETWORK_SECTION@@' iso/autoinstall/autoinstall.yaml
          grep -q 'ai-cpu-os-netplan.yaml' iso/build-iso.sh
          grep -q 'ai-cpu-os-netplan.yaml' iso/common/late-command.sh
          grep -q '/target/etc/netplan/99-ai-cpu-os.yaml' iso/common/late-command.sh
          grep -q '99-ai-cpu-os-disable-network.cfg' iso/common/late-command.sh
          grep -q 'NETWORK_MODE' iso/verify-iso.sh
          # A REDE TAMBEM TEM DE SER REPARAVEL no sistema ja instalado: uma ISO
          # nova nao conserta uma maquina que esta no chao. A mod `network` e o
          # caminho (ela ja existe em /opt/ai-cpu-os no alvo). Se ela sumir ou
          # perder as protecoes, quem ja instalou fica sem saida.
          grep -q 'network-test' Makefile
          grep -q 'validate:.*network-test' Makefile
          grep -q 'make network-test' .github/workflows/validate.yml
          grep -qE '^MOD_ID="network"' mods/network/mod.conf
          grep -qE '^MOD_SETS="network"' mods/network/mod.conf
          grep -q 'netplan' mods/network/apply.sh
          grep -q '99-ai-cpu-os.yaml' mods/network/apply.sh
          grep -q 'ai-cpu-os.bak' mods/network/apply.sh
          grep -q '99-ai-cpu-os-disable-network.cfg' mods/network/apply.sh
          grep -q -- '--root' mods/network/apply.sh
          # Um netplan valido que nao casa placa nenhuma mantem o sintoma
          # ('sem rede'); o script tem de AVISAR e sugerir --interface.
          grep -q 'não vai pegar NADA' mods/network/apply.sh
          grep -q -- '--dry-run' mods/network/apply.sh
          grep -q 'restaurado' mods/network/revert.sh
          # Ancorado na DEFINIÇÃO do alvo: 'network-fix' também aparece no
          # .PHONY e num comentário, então um grep solto não prova nada.
          grep -qE '^network-fix:' Makefile
          # --- mod `apt-sources`: o apt de quem JA instalou -----------------
          # O caso real: a ISO antiga gravava 'file:///opt/apt-repo' no alvo e,
          # quando o repositorio nao existia, TODO apt-get update falhava --
          # nem openssh-server instalava. A mod diagnostica e conserta.
          grep -q 'apt-test' Makefile
          grep -q 'validate:.*apt-test' Makefile
          grep -q 'make apt-test' .github/workflows/validate.yml
          grep -qE '^MOD_ID="apt-sources"' mods/apt-sources/mod.conf
          grep -qE '^MOD_SETS="apt"' mods/apt-sources/mod.conf
          grep -q 'file://' mods/apt-sources/apply.sh
          grep -q 'cdrom:' mods/apt-sources/apply.sh
          grep -q 'archive.ubuntu.com' mods/apt-sources/apply.sh
          grep -q 'deb.debian.org' mods/apt-sources/apply.sh
          grep -q 'ai-cpu-os.bak' mods/apt-sources/apply.sh
          # Um reparo que apaga fontes sem testar o resultado e' so' chute:
          # o apply TEM de validar com `apt-get update` (ou dizer que pulou).
          grep -q "apt-get update" mods/apt-sources/apply.sh
          grep -q 'PULADO' mods/apt-sources/apply.sh
          grep -q 'restaurado' mods/apt-sources/revert.sh
          grep -qE '^apt-fix:' Makefile
          # --- --iso-repo auto: a RELEASE tem de ser conferida de verdade -----
          # `--iso-repo auto` e o que embute openssh-server/sudo na midia (a
          # instalacao deixa de depender de rede). Mas .deb de outra release
          # quebram a instalacao -- entao a conferencia precisa funcionar:
          #  * a versao sai do ARQUIVO (--iso), nao de um default fixo;
          #  * o codename sai da propria ISO, nao de uma tabela que envelhece.
          grep -q 'basename "\$INPUT_ISO"' iso/build-iso.sh
          grep -q 's#^ubuntu-' iso/build-iso.sh
          grep -q '^iso_base_codename()' iso/build-iso.sh
          grep -qF 'want="$(iso_base_codename)"' iso/build-iso.sh
          grep -q '\.disk/info' iso/build-iso.sh
          grep -qF 'ISO_REPO_ALLOW_MISMATCH -eq 0' iso/build-iso.sh
          # e o mismatch DEGRADA (ISO_REPO=none + aviso), nunca aborta: e
          # default, e a Regra 13-a vale aqui como em qualquer lugar.
          grep -q 'ISO_REPO="none"' iso/build-iso.sh
          grep -q 'iso-release-test' Makefile
          grep -q 'validate:.*iso-release-test' Makefile
          grep -q 'make iso-release-test' .github/workflows/validate.yml
          # --- O verificador nao pode quebrar por FALTA DE ESPACO -----------
          # Ele extraia o modelo INTEIRO (1,1 GB) para conferir o magic GGUF,
          # e mktemp -d usa /tmp (tmpfs em muitas maquinas). O /tmp enchia no
          # meio da verificacao e TODA extracao seguinte falhava -- cascata de
          # falsos FAIL culpando a ISO (inclusive "rede auto sem o netplan").
          test -f tests/test-verify-iso-space.sh
          grep -q 'df -Pk' iso/verify-iso.sh
          grep -q '^fetch_head()' iso/verify-iso.sh
          grep -q 'report_lba' iso/verify-iso.sh
          # o caminho de leitura por LBA tem de estar ATIVO (um `if false`
          # aqui volta a extrair o arquivo inteiro e enche o /tmp)
          grep -qF 'if [[ -n "$lba" ]]; then' iso/verify-iso.sh
          # O LBA de inicio e o campo DEPOIS da primeira virgula; pegar o
          # primeiro numero le o comeco da ISO e o magic sai lixo.
          grep -qF 'data lba:' iso/verify-iso.sh
          grep -q -- '--tmp' iso/verify-iso.sh
          grep -q 'iso-space-test' Makefile
          grep -q 'validate:.*iso-space-test' Makefile
          grep -q 'make iso-space-test' .github/workflows/validate.yml
          # --- A familia NAO pode ser reportada como "forcada" quando foi ---
          # --- apenas DETECTADA e repassada pela cadeia (log enganoso).    ---
          grep -qF 'detectada na CPU e repassada pela cadeia' llama-build.sh
          grep -qF 'a CPU sugere' llama-build.sh
          # --- A INSTALACAO NAO PODE PARAR PEDINDO ENTRADA ----------------
          # O caminho Debian (preseed) saiu no ADR-001. O que ele ensinou
          # continua valendo como CLASSE de bug: o instalador automatico
          # tem de comecar sozinho e nao parar em tela interativa. No
          # Ubuntu/Subiquity os equivalentes sao outros, e cada um tem guarda.
          #
          #  (a) o Subiquity so entra em modo automatico se a cmdline do
          #      GRUB pedir `autoinstall`; sem isso ele abre o instalador
          #      INTERATIVO e a VM fica parada esperando teclado.
          grep -qF 'autoinstall quiet' iso/build-iso.sh
          #  (b) o autoinstall tem de estar na RAIZ da ISO, ao lado de
          #      `casper/` — e assim que o Subiquity o encontra na midia.
          grep -qF '${UBUNTU_STAGE}/autoinstall.yaml" /autoinstall.yaml' iso/build-iso.sh
          grep -qF '/autoinstall.yaml' iso/verify-iso.sh
          #  (c) a instalacao tem de REINICIAR sozinha no fim: sem
          #      `shutdown: reboot` a maquina para no "Reboot Now" e o
          #      1o boot nunca acontece.
          grep -qE '^shutdown:[[:space:]]*reboot' iso/autoinstall/autoinstall.yaml
          #  (d) nada de rede no instalador: `refresh-installer.update: true`
          #      baixa o instalador novo, e `geoip: true` faz consulta remota.
          #      Os dois reabrem telas numa ISO air-gapped (Regra 13-b).
          grep -qE '^[[:space:]]+update:[[:space:]]*false' iso/autoinstall/autoinstall.yaml
          grep -qE '^[[:space:]]+geoip:[[:space:]]*false' iso/autoinstall/autoinstall.yaml
          #  (e) `deb cdrom:` no sources.list do alvo: depois da instalacao
          #      a midia nao existe e TODO `apt-get update` falha. O
          #      late-command tem de remover a linha.
          grep -qF 'deb(-src)?[[:space:]]+cdrom:' iso/common/late-command.sh
          # e o verificador tem de cobrar o caminho NOVO dos templates na
          # midia (era /preseed/... antes do ADR-001).
          grep -qF 'ai-cpu-os-boot/late-command.sh' iso/verify-iso.sh
          # O repositório da mídia precisa de um CODENAME de verdade no Release:
          # com './' o late-command recusava por "outra release" e o alvo
          # ficava sem a fonte local (o 1º boot dependia de rede).
          grep -q "printf 'Codename: %s" iso/build-iso.sh
          if grep -q "printf 'Codename: ./" iso/build-iso.sh; then
            echo "::error file=iso/build-iso.sh::o Release do repo local nao pode ter 'Codename: ./'"
            exit 1
          fi
          # O firstboot tem de SINCRONIZAR o disco antes de sair, e o teste de
          # VM tem de dar tempo ao qemu antes de encerrar. Sem isso, um
          # desligamento logo depois deixa arquivos com 0 byte — `llama-server`,
          # `ai-server.service` (unit vazio = "masked") e `.firstboot-status`
          # (visto na sessao #29, ao inspecionar o disco instalado).
          grep -q '^sync' iso/common/firstboot.sh
          grep -q 'descarregarem o disco' iso/test-vm.sh
          #  (f) no sistema instalado /dev/console e o ULTIMO `console=` da
          #      cmdline, entao o marcador do 1o boot nunca chegava ao serial:
          #      o test-vm.sh esperava para sempre. O firstboot.sh tem de
          #      espelhar no ttyS0.
          grep -q '/dev/ttyS0' iso/common/firstboot.sh
          grep -q 'ai-cpu-os/firstboot' iso/common/firstboot.sh
          grep -q 'ai-cpu-os/iso-late' iso/common/late-command.sh
          grep -q 'aplicação concluída com sucesso' iso/test-vm.sh
          #      Espelhar o build INTEIRO no ttyS0 trava o console da VM (medido).
          if grep -qF 'tee -a "$LOG" > /dev/ttyS0' iso/common/firstboot.sh; then
            echo "::error file=iso/common/firstboot.sh::nao espelhe o build inteiro no ttyS0 (trava o console)"
            exit 1
          fi
          #  (g) sem `sshd` o alvo instalado fica INACESSIVEL (varredura de
          #      portas numa maquina real: 65535 em RST, nenhum listener).
          #      O autoinstall pede `ssh.install-server`, e o late-command
          #      VERIFICA e conserta — as duas coisas precisam existir.
          grep -qF 'install-server: true' iso/autoinstall/autoinstall.yaml
          grep -q 'openssh-server' iso/common/late-command.sh
          grep -q 'LEIA-SSH.md' iso/common/late-command.sh
          grep -q 'GARANTE o SSH' iso/verify-iso.sh
          grep -q '^ensure_ssh()' build.sh
          grep -qE '^[[:space:]]+ensure_ssh$' build.sh
          #  (h) `sudo` tem de estar nos pacotes: o usuario da ISO esta no
          #      grupo sudo e, com o root bloqueado, sem ele nao ha acesso
          #      administrativo.
          if ! grep -qE '^EXTRA_PACKAGES="[^"]*\bsudo\b' iso/build-iso.sh; then
            echo "::error file=iso/build-iso.sh::EXTRA_PACKAGES precisa incluir 'sudo'"
            exit 1
          fi
          # O llama.cpp RENOMEIA flags entre versões: um `--no-mmap` fixo na
          # unit derrubou o servico em loop com "invalid argument" na primeira
          # ISO cujo ai-server subiu de verdade (sessao #29). A unit tem de
          # deixar o install.sh PERGUNTAR ao binario qual sintaxe vale.
          # Ancorado numa DIRETIVA (linha indentada), nao na citacao dentro do
          # comentario que explica o bug — foi o erro que este guarda cometeu
          # na primeira versao.
          if grep -qE '^[[:space:]]+--no-mmap' roles/inference/ai-server.service; then
            echo "::error file=roles/inference/ai-server.service::--no-mmap fixo (use LLAMA_EXTRA_ARGS + deteccao)"
            exit 1
          fi
          grep -q 'LLAMA_EXTRA_ARGS' roles/inference/ai-server.service
          grep -qE '^[[:space:]]*detect_extra_args\(\)' roles/inference/install.sh
          grep -q -- '--load-mode' roles/inference/install.sh
          # shell-ia: esgotar as rodadas NAO pode devolver a linha do protocolo
          # ("RESULT: ...") como se fosse a resposta do modelo.
          if grep -q 'return messages\[-1\]' roles/inference/shell-ia.py; then
            echo "::error file=roles/inference/shell-ia.py::devolve a linha do protocolo como resposta final"
            exit 1
          fi
          # O workflow da ISO NAO pode passar `DISTRO=` ao make: a variavel
          # deixou de existir (ADR-001) e um override silencioso geraria a
          # midia sem ninguem perceber. `make` NAO reclama de variavel extra.
          if grep -qE '\bISO_DISTRO\b|DISTRO="?\$' .github/workflows/iso.yml; then
            echo "::error file=.github/workflows/iso.yml::DISTRO voltou (variavel removida pelo ADR-001)"
            exit 1
          fi
          grep -q -- '--distro ubuntu' .github/workflows/iso.yml
          # O dry-run dos DOIS caminhos da ISO tem de ser um alvo do Makefile, e
          # o CI tem de CHAMAR esse alvo (e nao repetir o comando). Foi um
          # comando duplicado que deixou passar a regressao do --iso-repo auto:
          # o CI falhava e o `make validate` local passava.
          grep -q 'iso-dry-run' Makefile
          grep -q 'validate:.*iso-dry-run' Makefile
          grep -q 'make iso-dry-run' .github/workflows/validate.yml
          # A escolha da ISO oficial no SHA256SUMS. Mesmo trio do dry-run, pelo
          # MESMO motivo: a geracao da ISO Ubuntu morria com `exit code 22`
          # (404 do curl) porque o SHA256SUMS do Ubuntu marca o modo binario
          # com `*` e lista todas as point releases. As fixtures sao copias
          # fieis dos arquivos oficiais e precisam continuar existindo — uma
          # fixture inventada NAO pega esse bug.
          grep -q 'iso-select-test' Makefile
          grep -q 'validate:.*iso-select-test' Makefile
          grep -q 'make iso-select-test' .github/workflows/validate.yml
          # Ancorado na DEFINICAO da funcao (`^nome()`) e nao no nome solto:
          # `grep 'normalize_iso_name'` tambem casa `normalize_iso_name_velho`,
          # entao renomear a funcao passaria batido. Testado com caso positivo.
          grep -q '^pick_iso_entry()' iso/build-iso.sh
          grep -q '^normalize_iso_name()' iso/build-iso.sh
          # AVX-512 (política por família) e a TRAVA DE INSTÂNCIA ÚNICA do
          # gerador de ISO. Mesmo trio de cada um: alvo no Makefile, entrada no
          # `validate` e o CI CHAMANDO o alvo — comando duplicado diverge.
          grep -q 'avx512-test' Makefile
          grep -q 'validate:.*avx512-test' Makefile
          grep -q 'make avx512-test' .github/workflows/validate.yml
          grep -q 'iso-lock-test' Makefile
          grep -q 'validate:.*iso-lock-test' Makefile
          grep -q 'make iso-lock-test' .github/workflows/validate.yml
          # Ancorado na DEFINIÇÃO: sem a função, a proteção sumiu (o `.part`
          # volta a ser renomeado às cegas e o erro volta a ser críptico).
          grep -q '^acquire_build_lock()' iso/build-iso.sh
          grep -q '^download_to()' iso/build-iso.sh
          # DISCO DO AUTOINSTALL: `--disk auto` tem de significar "nao fixar o
          # disco" DE VERDADE. Antes o valor ia LITERAL para o YAML e virava
          # `match: {path: auto}` — um caminho inventado, que nao casa com disco
          # nenhum: a mitigacao documentada reproduzia o proprio bug.
          grep -q 'iso-disk-test' Makefile
          grep -q 'validate:.*iso-disk-test' Makefile
          grep -q 'make iso-disk-test' .github/workflows/validate.yml
          # IDENTIDADE POR PAPEL (ADR-002): o usuario padrao deriva da FUNCAO
          # (inference -> ai-inference, builder -> ai-builder) e a origem fica
          # registrada no .iso-config. Se a derivacao sumir, o alvo nasce com
          # `ai-cpu-os` e ninguem percebe — o modo de falha e' silencioso.
          grep -q 'identity-test' Makefile
          grep -q 'validate:.*identity-test' Makefile
          grep -q 'make identity-test' .github/workflows/validate.yml
          grep -q '^resolve_identity()' iso/build-iso.sh
          # Ancorado no BRACO DO CASE, nao no nome solto: `ai-inference` tambem
          # aparece em comentario e na mensagem de log, entao um `grep` pelo
          # nome passaria mesmo com a derivacao trocada por ai-cpu-os.
          grep -qE "^    inference\) printf 'ai-inference'" iso/build-iso.sh
          grep -qE "^    builder\)   printf 'ai-builder'" iso/build-iso.sh
          # O `--username` explicito tem de VENCER o papel (senao a flag mente).
          # Ancorado na CONDICAO: a variavel sozinha aparece na atribuicao.
          grep -qE '^  if \[\[ \$USERNAME_EXPLICIT -eq 1 \]\]; then' iso/build-iso.sh
          # A identidade tem de chegar ao alvo, nao so ao autoinstall.
          grep -q 'ISO_USERNAME=%s' iso/common/late-command.sh
          grep -q 'IDENTITY_SOURCE=%s' iso/common/late-command.sh
          # Formato estavel da linha: e' o que o teste le sem gerar ISO.
          grep -q 'usuario=%s hostname=%s papel=%s origem=%s' iso/build-iso.sh
          # O verificador confere a DERIVACAO (nao so a presenca do campo).
          grep -q 'derivação do ADR-002' iso/verify-iso.sh
          test -f tests/test-role-identity.sh
          grep -qE 'DISK" == "auto"' iso/build-iso.sh
          # O default do CI nao pode ser um caminho que so existe em VM: a ISO
          # do artefato sairia sem instalar sozinha em hardware real.
          if grep -qE "inputs\.disk \|\| '/dev/vda'" .github/workflows/iso.yml; then
            echo "::error file=.github/workflows/iso.yml::default do disco voltou a /dev/vda (so existe em VM)"
            exit 1
          fi
          grep -q "inputs.disk || 'auto'" .github/workflows/iso.yml
          # ARMADILHA JÁ PISADA (run do v0.2.5 e do main): no `if:` do GitHub,
          # `matrix.exec != 'false'` compara BOOLEANO com STRING e o passo NUNCA
          # é pulado — as famílias AVX-512/AMX rodaram no runner SEM a ISA e
          # tomaram SIGILL (exit 132). O valor tem de ir por `env:`.
          BUILD_LLAMA_WF=.github/workflows/build-llama.yml
          if grep -qE '^[[:space:]]*if:.*matrix\.exec' "$BUILD_LLAMA_WF"; then
            echo "::error file=$BUILD_LLAMA_WF::matrix.exec no if: nunca da falso (booleano x string)."
            echo "Passe o valor por env: e decida no bash (SIGILL/exit 132 nas familias AVX-512/AMX)."
            exit 1
          fi
          # O filtro de candidatos e o fallback um-a-um do download do repo
          # apt. O `-n 25` sozinho (ou `|| true` cru) e o que perdia 25
          # pacotes por lote em silencio — nao pode voltar.
          grep -q '^packages_with_candidate()' iso/build-iso.sh
          grep -q 'iso-repo-test' Makefile
          grep -q 'validate:.*iso-repo-test' Makefile
          grep -q 'make iso-repo-test' .github/workflows/validate.yml
          grep -q 'ci-guards-test' Makefile
          grep -q 'validate:.*ci-guards-test' Makefile
          grep -q 'make ci-guards-test' .github/workflows/validate.yml
          grep -q 'iso-verify-test' Makefile
          grep -q 'validate:.*iso-verify-test' Makefile
          grep -q 'make iso-verify-test' .github/workflows/validate.yml
          grep -q 'iso-check-test' Makefile
          grep -q 'validate:.*iso-check-test' Makefile
          grep -q 'make iso-check-test' .github/workflows/validate.yml
          # O conferidor de ISO baixada NAO pode passar a exigir xorriso: e
          # justamente a ausencia dele que faz o script existir.
          grep -q 'CD001' iso/check-iso.sh
          grep -q 'AI_CPU_OS' iso/check-iso.sh
          # O ARTIFACT sobe SEMPRE: o limite de 2 GiB e de ASSET DE RELEASE,
          # nao de artifact. Na versao anterior o mesmo booleano gateava os
          # dois, e a ISO air-gapped (~4 GB) era gerada e DESCARTADA — quem
          # nao tem xorriso ficava sem nenhum caminho para obter o arquivo.
          if grep -q 'steps.size.outputs.too_big' .github/workflows/iso.yml; then
            echo "::error::artifact gateado pelo limite da Release (air-gapped ficaria sem download)"
            exit 1
          fi
          grep -q 'release_too_big' .github/workflows/iso.yml
          # O verificador so tem UMA base (ADR-001) e precisa cobrar dela o
          # que ainda importa: o autoinstall na raiz da ISO e a recusa
          # explicita do caminho Debian.
          grep -q 'ADR-001' iso/verify-iso.sh
          if grep -q 'apt-setup/local0' iso/verify-iso.sh; then
            echo "::error file=iso/verify-iso.sh::ainda confere preseed (caminho Debian removido pelo ADR-001)"
            exit 1
          fi
          # GRAVADOR DE PENDRIVE: as travas que impedem gravar no disco errado
          # nao podem sumir, e a gravacao nao pode perder a verificacao. Cada
          # uma destas linhas e uma protecao real contra apagar a maquina.
          grep -q 'pendrive-test' Makefile
          grep -q 'validate:.*pendrive-test' Makefile
          grep -q 'make pendrive-test' .github/workflows/validate.yml
          grep -q 'root_disk_name' iso/write-pendrive.sh
          grep -q 'sistema em execução' iso/write-pendrive.sh
          grep -q 'allow-internal' iso/write-pendrive.sh
          grep -q 'confirm_target' iso/write-pendrive.sh
          grep -q 'cmp -n' iso/write-pendrive.sh
          grep -q 'conv=fsync' iso/write-pendrive.sh
          # As travas mais faceis de perder sem ninguem notar: o TYPE=disk
          # (um sr0/DVD tem RM=1 e passaria como removivel), a assinatura
          # CD001, o nome do device como confirmacao e o teste que NUNCA
          # encosta num dispositivo de verdade (grava num ARQUIVO).
          grep -q 'TYPE' iso/write-pendrive.sh
          grep -q 'CD001' iso/write-pendrive.sh
          grep -q 'dev_is_removable' iso/write-pendrive.sh
          grep -q 'ARQUIVO' tests/test-write-pendrive.sh
          # INTERFACE WEB: o valor dela esta em ser segura por construcao, e
          # cada uma destas linhas e o que garante isso.
          grep -q 'ui-test' Makefile
          grep -q 'validate:.*ui-test' Makefile
          grep -q 'make ui-test' .github/workflows/validate.yml
          # O JavaScript da pagina tem de ser EXECUTADO no CI, nao so lido:
          # um erro no topo do <script> mata a pagina inteira e a API continua
          # respondendo (foi o bug da sessao #43).
          grep -q 'ui-page-test' Makefile
          grep -q 'validate:.*ui-page-test' Makefile
          grep -q 'make ui-page-test' .github/workflows/validate.yml
          test -f tests/test-webui-page.sh
          # A REGRA da pagina, em forma estatica: nada no topo do <script> pode
          # depender de dados que so existem depois do fetch. Chamada de topo =
          # na COLUNA 0 (dentro de funcao/IIFE ela vem indentada).
          if grep -qE '^syncIdentityHint\(\);' webui/index.html; then
            echo "::error file=webui/index.html::syncIdentityHint() no TOPO do script"
            echo "::error::OPTIONS ainda e null ali: o TypeError mata a pagina inteira"
            exit 1
          fi
          # e a guarda de OPTIONS nulo tem de continuar la (ancorada no valor).
          grep -qF '(OPTIONS && OPTIONS.identity)' webui/index.html
          # CHAT DA FROTA (ai-talk): o teste offline precisa rodar no CI e ser
          # chamado pelo alvo `validate` (corolario da Regra 13-a: comando
          # duplicado entre CI e make diverge e o local passa enquanto o CI cai).
          grep -q 'talk-test' Makefile
          grep -q 'validate:.*talk-test' Makefile
          grep -q 'make talk-test' .github/workflows/validate.yml
          # Invariantes do ADR-003/005 que nao podem sumir do codigo:
          grep -q 'MAX_PEERS = 15' talk/ai_talk.py
          # --- F2: o chat tem de CHEGAR na maquina (ADR-003) ----------------
          # Um teste que roda so no make = regressao invisivel no CI.
          grep -q 'talk-install-test' Makefile
          grep -q 'validate:.*talk-install-test' Makefile
          grep -q 'make talk-install-test' .github/workflows/validate.yml
          grep -q 'iso-chat-test' Makefile
          grep -q 'validate:.*iso-chat-test' Makefile
          grep -q 'make iso-chat-test' .github/workflows/validate.yml
          # O instalador existe e NAO pode baixar nada (ISO air-gapped).
          test -f talk/install.sh
          test -f talk/ai-talk.service
          if grep -qE '^[[:space:]]*(curl|wget|pip3?[[:space:]]+install)' talk/install.sh; then
            echo "::error file=talk/install.sh::o instalador do chat baixa algo (a ISO e air-gapped)"
            exit 1
          fi
          # Sem chave = servico DESABILITADO (um canal sem HMAC nao autentica).
          # Ancorado na LINHA do ramo sem chave: `ENABLE_SERVICE=0` tambem
          # aparece em `--no-service`, entao o nome solto passaria mesmo com o
          # ramo sem chave trocado por 1.
          grep -qE '^  ENABLE_SERVICE=0$' talk/install.sh
          # Chave legivel por "outros" e RECUSADA nos dois lados (install e ISO).
          # Ancorado na CONDICAO: o teste de bit (8#004) e o que precisa existir.
          grep -qF '(( (8#$perms & 8#004) != 0 ))' talk/install.sh
          grep -qF '(( (8#$perms & 8#004) != 0 ))' iso/build-iso.sh
          # A chave POR NO tem de ser passada explicitamente (nome + caminho).
          grep -q -- '--peer-key' talk/install.sh
          # `--keydir` sozinho tem de produzir um servico que INICIA: a chave
          # do proprio no (keys/<no>.key) vai para o key_file. Sem isso a
          # config aponta para /etc/ai-talk/fleet.key, que nao existe nesse
          # modo, e o daemon morre no start — com o servico habilitado.
          grep -q 'OWN_KEY_FROM_KEYDIR=1' talk/install.sh
          # A checagem de chave orfa tem de vir DEPOIS da montagem da frota:
          # antes dela todo peer vindo de --peers-file era acusado de orfao.
          # Compara POSICOES de duas linhas-ancora (nome solto passaria mesmo
          # com o bloco na posicao errada).
          # (sem heredoc: a linha final dele sairia do bloco YAML do `run:`)
          # `head -1`: pode haver mais de uma ocorrência (o comentário é citado
          # em outros pontos) e a comparação numérica explodiria calada.
          orf_pos="$(grep -n 'A chave do PRÓPRIO nó não é' talk/install.sh | head -1 | cut -d: -f1)"
          fleet_pos="$(grep -n '^# Peers do arquivo' talk/install.sh | head -1 | cut -d: -f1)"
          if [[ -z "$orf_pos" || -z "$fleet_pos" ]] || (( orf_pos < fleet_pos )); then
            echo "::error file=talk/install.sh::a checagem de chave orfa roda antes dos peers do arquivo"
            exit 1
          fi
          # Teto de 15 tambem na geracao da ISO (ADR-005), nao so no daemon.
          grep -q 'teto de 15' iso/build-iso.sh
          # Os tres elos da corrente ISO -> alvo tem de existir.
          # Ancorado na CHAMADA (a definicao continuaria la mesmo sem ninguem
          # chamar — o payload nao entraria na midia e o teste passaria).
          grep -qF 'stage_chat_payload "${dest}/chat"' iso/build-iso.sh
          grep -q 'AI_CHAT_INSTALL' iso/common/firstboot.sh
          grep -q 'CHAT_KEY=%s' iso/common/late-command.sh
          grep -qE '^  run_chat_install$' build.sh
          # e o chat tem de rodar ANTES do papel (para relatar falha do papel).
          grep -q '=== Etapa 2/5: Chat da frota' build.sh
          # A unit do systemd endurecida (CHAT.md §9): sem isso o daemon roda
          # como root com o sistema inteiro gravavel.
          # ProtectSystem=strict (nao `yes`): o modo estrito e o que torna o
          # resto do sistema somente leitura. `yes` deixaria /usr gravavel.
          grep -q '^NoNewPrivileges=yes$'  talk/ai-talk.service
          grep -q '^ProtectSystem=strict$' talk/ai-talk.service
          grep -q '^ProtectHome=yes$'      talk/ai-talk.service
          grep -q '^PrivateTmp=yes$'       talk/ai-talk.service
          grep -qE '^RestrictAddressFamilies=.*AF_INET.*AF_UNIX' talk/ai-talk.service
          grep -q 'compare_digest' talk/ai_talk.py
          grep -q 'TCP_NODELAY' talk/ai_talk.py
          grep -q 'os.fsync' talk/ai_talk.py
          # O valor importa: 1024 IDs não cobrem o retry de 9 s a 280 msg/s.
          grep -q '"dedupe_window": 8192' talk/ai_talk.py
          # Sem chave, nao inicia (fail closed) e chave frouxa e recusada.
          grep -q 'stat.S_IROTH' talk/ai_talk.py
          # Biblioteca padrao: nenhum import de terceiro no ai-talk.
          if grep -Eq '^(import|from) +(requests|yaml|numpy|zmq|paho|twisted)' talk/ai_talk.py; then
            echo "::error file=talk/ai_talk.py::import de terceiro (o ai-talk usa so stdlib)"
            exit 1
          fi
          # A lista branca de acoes e o que impede "rode este comando pra mim":
          # a UI so consegue disparar alvos que existem neste dicionario.
          grep -q '^ACTIONS = {' webui/server.py
          # Os validadores de entrada ancoram os valores que vao para o shell.
          grep -q '^RE_DISK = ' webui/server.py
          grep -q '^RE_ISO_NAME = ' webui/server.py
          # Default local + recusa explicita de amarrar em outra interface.
          grep -q '"127.0.0.1"' webui/server.py
          grep -q 'args.host not in' webui/server.py
          # Senhas: so as do usuario/root DA ISO (decisao do dono, 2026-10-16),
          # e SEMPRE como hash crypt antes da linha de comando. Texto puro so
          # existe em memoria; a flag de texto puro ('--password ') nem existe
          # no build-iso.sh. O pendrive continua intocado: sudo segue proibido.
          if grep -qE '(sudo -S|askpass)' webui/server.py webui/index.html; then
            echo "::error::a interface web nao pode pedir senha de sudo (o pendrive exige o terminal)"
            exit 1
          fi
          if grep -qE -- '--(root-)?password([ "]|$)' webui/server.py webui/index.html; then
            echo "::error::senha em TEXTO PURO na linha de comando (so --password-hash/--root-password-hash)"
            exit 1
          fi
          grep -qE 'crypt\.(crypt|mksalt)' webui/server.py \
            || { echo "::error file=webui/server.py::senha sem hash crypt (texto puro chegaria ao build)"; exit 1; }
          # Sem dependencia de terceiros: esta maquina e limitada e o usuario
          # nao pode ser obrigado a um `pip install` antes de gerar a ISO.
          if grep -qE '^(import|from) (fastapi|flask|django|aiohttp|requests)' webui/server.py; then
            echo "::error file=webui/server.py::a UI usa dependencia externa (deve ser so stdlib)"
            exit 1
          fi
          # ESCopo: so o codigo da UI. Citar `pip install` no README e
          # justamente a doc explicando que NAO se instala nada — foi a
          # armadilha 'guarda casa com a prosa que o explica'.
          if grep -qE 'pip[3]? install' webui/server.py webui/index.html; then
            echo "::error::a UI nao pode exigir pip install (stdlib only)"
            exit 1
          fi
          # ...e a doc tem de PROMETER isso ao usuario.
          grep -qi 'biblioteca padrão' README.md
          # Nada de CDN: um `<script src="https://...">` deixaria a pagina
          # quebrada justamente na maquina offline/limitada.
          if grep -qE '(src|href)="https?://' webui/index.html; then
            echo "::error file=webui/index.html::a pagina carrega recurso externo (quebraria offline)"
            exit 1
          fi
          # E a midia NAO leva a UI: ela e ferramenta da maquina que GERA a
          # ISO, nao do sistema instalado (Regra 13-b).
          grep -q 'exclude=./webui' iso/build-iso.sh
          # REPOSITORIO APT: a 2a tentativa tem de (a) refrescar o INDICE (um
          # 404 de espelho nao melhora com Acquire::Retries — a lista invalida
          # e reusada, e foi o que o run #16 mostrou em 4 s) e (b) LOGAR a
          # saida do apt, em vez de descarta-la: foi o descarte que deixou o
          # run #16 ilegivel ("pacote ausente" de um pacote que existe).
          grep -q 'índice fresco para a 2ª tentativa' iso/build-iso.sh
          grep -q 'Ainda faltando depois da 2ª tentativa' iso/build-iso.sh
          if grep -qE 'apt-get download -o Acquire::Retries=5 \$\{faltando\}' iso/build-iso.sh; then
            echo "::error file=iso/build-iso.sh::o retry volta a DESCARTAR a saida do apt (log ilegivel)"
            exit 1
          fi
          if grep -q 'xargs -r -n 25' iso/build-iso.sh; then
            echo "::error file=iso/build-iso.sh::lote sem fallback: um nome ruim perde 25 pacotes"
            exit 1
          fi
          # A fixture PRECISA manter o marcador binario `*` — e ele que
          # reproduz o 404. `-F` para deixar explicito que e texto literal
          # (em BRE o `*` so e especial depois de um atomo, mas um leitor
          # futuro pode "corrigir" o que ja esta certo).
          grep -qF '*ubuntu-24.04.5-live-server-amd64.iso' tests/fixtures/SHA256SUMS.ubuntu-24.04
          # Versoes de actions alinhadas: o iso.yml ficou preso em @v4 enquanto
          # o resto do repo ja estava em @v6/@v7 (o bump do Dependabot nao o
          # alcancou). Nada de actions/* em major antigo.
          if grep -qE 'uses: actions/[a-z-]+@v[1-4]$' .github/workflows/*.yml; then
            echo "::error::actions/* em major antigo (@v1..@v4) — alinhe com o resto do repo"
            exit 1
          fi
          # `upload-artifact` fixado no v7: o repo padronizou nele (runtime
          # node24; o v7 e ADITIVO — novo parametro OPCIONAL `archive:false`
          # para upload direto de arquivo unico, default `name:`/`path:`
          # intacto). Sobrou um @v6 no main porque o PR #3 do Dependabot
          # trazia o bump e eu alinhei o iso.yml copiando o major vizinho.
          #
          # Guarda NEGATIVO (nao pode voltar para @v1..@v6) + POSITIVO. O
          # positivo e POR ARQUIVO de proposito: contar `*.yml` incluiria este
          # proprio validate.yml, que CITA a string dentro do comando — a
          # contagem ficaria inflada e a perda de UM dos dois passaria.
          if grep -qE 'actions/upload-artifact@v[1-6]' .github/workflows/*.yml; then
            echo "::error::upload-artifact abaixo do v7 — o repo padronizou no v7 (runtime node24)"
            exit 1
          fi
          grep -q 'uses: actions/upload-artifact@v7' .github/workflows/build-llama.yml
          grep -q 'uses: actions/upload-artifact@v7' .github/workflows/iso.yml
          # E o atalho proibido continua proibido: nunca embutir binário
          # pré-compilado do llama.cpp (exigiria 1 ISO por família).
          if grep -q -- '--prebuilt' iso/build-iso.sh; then
            echo "::error file=iso/build-iso.sh::'--prebuilt' volta a ser proibido (Regra 13-b)"
            exit 1
          fi
          # Instrução COPY de verdade (o Dockerfile CITA esse comando num
          # comentário didático — por isso ancoramos no início da linha).
          if grep -qE '^COPY[[:space:]]+.*build/bin' docker/Dockerfile; then
            echo "::error file=docker/Dockerfile::COPY build/bin (RPATH -> exit 127): use cmake --install"
            exit 1
          fi
          # META-GUARDA: proibe a forma que NAO derruba o job.
          if grep -nE '^[[:space:]]*! ' .github/workflows/*.yml; then
            echo "::error::guarda na forma '! cmd' nao derruba o job (set -e ignora cmd invertido)"
            exit 1
          fi
          # O diário de continuidade é o que permite retomar sem perder nada
          # (Regra 14): precisa continuar existindo e com as seções-chave.
          grep -qi 'retomada em 5 minutos' docs/JOURNAL.md
          grep -q 'Threads abertas' docs/JOURNAL.md
          grep -q 'Armadilhas já pisadas' docs/JOURNAL.md
          grep -q 'Como registrar uma nova sessão' docs/JOURNAL.md
          grep -q 'docs/JOURNAL.md' AGENTS.md
          echo "Docs vivas OK."
