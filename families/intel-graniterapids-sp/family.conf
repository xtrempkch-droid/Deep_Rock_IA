# families/intel-graniterapids-sp/family.conf — Intel Xeon 6 (Granite Rapids, P-cores)
# -----------------------------------------------------------------------------
# Xeon 6 com P-cores (ex.: 6980P, 6780P). AVX-512 + AMX (incluindo FP16).
# Os E-cores (Sierra Forest, 6xxxE) NÃO têm AVX-512: caem em `generic`.
#
# ⚠️ `-march=graniterapids` exige GCC >= 14 (no GCC 13 cai em sapphirerapids,
# com aviso — um binário sapphirerapids roda em Granite Rapids normalmente).

FAMILY_ID="intel-graniterapids-sp"
FAMILY_NAME="Intel Xeon 6 (Granite Rapids, P-cores)"
FAMILY_VENDOR="intel"
FAMILY_ARCH="x86_64"

FAMILY_INHERITS="intel-emeraldrapids-sp"

FAMILY_MARCH="-march=graniterapids -mtune=graniterapids"
FAMILY_MARCH_MIN_GCC="14"
FAMILY_MARCH_FALLBACK="-march=sapphirerapids -mtune=sapphirerapids"
FAMILY_MARCH_HAS_AVX512="yes"

FAMILY_ISA_REQUIRED="avx avx2 fma f16c"
FAMILY_ISA_OPTIONAL="avx512f avx512cd avx512bw avx512dq avx512vl avx512vnni avx512vbmi avx512vbmi2 avx512bitalg avx512vpopcntdq avx512fp16 amx_tile amx_int8 amx_bf16 amx_fp16"

FAMILY_AVX512_POLICY="auto"

FAMILY_MATCH_NAME="6[0-9]{3}P|Granite ?Rapids"
FAMILY_CPUID_HINT="Xeon 6, P-cores (Granite Rapids)"
FAMILY_NOTES="AVX-512 + AMX ligam por padrão. Só os P-cores: o sufixo P no modelo (6xxxE = Sierra Forest cai em generic)."
