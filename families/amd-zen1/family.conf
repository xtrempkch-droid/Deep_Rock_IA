# families/amd-zen1/family.conf — AMD Zen / Zen+ (Ryzen 1000/2000)
# -----------------------------------------------------------------------------

FAMILY_ID="amd-zen1"
FAMILY_NAME="AMD Zen / Zen+ (Ryzen 1000/2000)"
FAMILY_VENDOR="amd"
FAMILY_ARCH="x86_64"

FAMILY_INHERITS=""

FAMILY_MARCH="-march=znver1 -mtune=znver1"
FAMILY_MARCH_MIN_GCC="6"
FAMILY_MARCH_FALLBACK=""

FAMILY_ISA_REQUIRED="avx avx2 fma f16c"
FAMILY_ISA_OPTIONAL=""

FAMILY_AVX512_POLICY="never"

FAMILY_MATCH_NAME="Ryzen .* (1[0-9]{3}|2[0-9]{3})|EPYC .* [0-9]{3}1|Threadripper .* 1[0-9]{3}"
FAMILY_CPUID_HINT="family 23 (0x17) — Zen, Zen+"
FAMILY_NOTES="Inclui os APUs Zen+ (ex.: Ryzen 3 3200G). Se um APU 3xxxG for identificado como Zen 2, force --family amd-zen1."
