# families/intel-broadwell/family.conf — Intel Xeon E5 v4 (Broadwell-EP)
# -----------------------------------------------------------------------------
# HERDA de intel-haswell. Broadwell-EP é a evolução direta do Haswell-EP:
# mesmo núcleo base, com melhorias (processo 14nm, L3 maior, AVX2 com melhores
# latências). Por isso a herança: o que vale para v3 vale para v4 — e o que
# melhoramos aqui (tuning, banda, ISA) beneficia também a família v3.
#
# Cobre TODA a família v4, por exemplo: E5-2680 v4, E5-2620 v4, E5-2650 v4.

FAMILY_ID="intel-broadwell"
FAMILY_NAME="Intel Xeon E5 v4 (Broadwell-EP)"
FAMILY_VENDOR="intel"
FAMILY_ARCH="x86_64"

FAMILY_INHERITS="intel-haswell"

FAMILY_MARCH="-march=broadwell -mtune=broadwell"
FAMILY_MARCH_MIN_GCC="4"
FAMILY_MARCH_FALLBACK=""

# Mesma ISA do Haswell-EP: AVX2, FMA, F16C. SEM AVX-512.
FAMILY_ISA_REQUIRED="avx avx2 fma f16c"
FAMILY_ISA_OPTIONAL=""

FAMILY_AVX512_POLICY="never"

FAMILY_MATCH_NAME="E5-[0-9]{4} ?v4|E7-[0-9]{3,4} ?v4|Xeon.*Broadwell|Broadwell"
FAMILY_CPUID_HINT="family 6 / model 79 (Broadwell-EP)"
FAMILY_NOTES="Alvo atual do projeto (E5-2680 v4, 14c/28t). Herda o tuning do Haswell-EP; o tuning daqui também vale para a família v3."
