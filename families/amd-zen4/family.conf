# families/amd-zen4/family.conf — AMD Zen 4 (Ryzen 7000/8000, EPYC Genoa/Siena)
# -----------------------------------------------------------------------------
# ⚠️ `-march=znver4` exige GCC >= 13 (Debian 12 traz GCC 12). Quando o GCC for
# mais antigo, o resolve.sh troca automaticamente para o fallback (znver3) e
# avisa. Instale um GCC novo (ou use o container) para o march completo.
#
# AVX-512: Zen 4 TEM avx512f (datapath 256+256). Política 'auto' (decisão do
# dono, 2026-10-16): liga por padrão quando a CPU reporta a flag.

FAMILY_ID="amd-zen4"
FAMILY_NAME="AMD Zen 4 (Ryzen 7000/8000, EPYC Genoa/Siena)"
FAMILY_VENDOR="amd"
FAMILY_ARCH="x86_64"

FAMILY_INHERITS="amd-zen3"

FAMILY_MARCH="-march=znver4 -mtune=znver4"
FAMILY_MARCH_MIN_GCC="13"
FAMILY_MARCH_FALLBACK="-march=znver3 -mtune=znver3"
FAMILY_MARCH_HAS_AVX512="yes"

FAMILY_ISA_REQUIRED="avx avx2 fma f16c"
FAMILY_ISA_OPTIONAL="avx512f avx512cd avx512dq avx512bw avx512vl avx512vnni avx512vbmi avx512vbmi2 avx512bitalg avx512vpopcntdq"

FAMILY_AVX512_POLICY="auto"

# Série 8000 de desktop/APU (8500G, 8600G, 8700G, 8845HS) é Zen 4 — NÃO 7xxx.
# EPYC: Genoa/Bergamo (9xx4, 9xx4X), Siena/Zen 4c (8xx4) e 4004 (Zen 4 SMB).
# Zen 5 (Ryzen 9xxx, EPYC 9xx5) tem família própria: amd-zen5.
FAMILY_MATCH_NAME="Ryzen .* (7[0-9]{3}|8[0-9]{3})|EPYC (9[0-9]{2}4(X)?|8[0-9]{2}4(P)?|4[0-9]{3})|Threadripper .* 7[0-9]{3}|Zen ?4"
FAMILY_CPUID_HINT="family 25 (0x19) — Zen 4"
FAMILY_NOTES="AVX-512 liga por padrão (política 'auto'; Zen 4 tem avx512f com datapath 256+256). Ryzen 9000 e EPYC 9005 são Zen 5: família amd-zen5."
