# families/amd-zen4/family.conf — AMD Zen 4 (Ryzen 7000/9000, EPYC Genoa)
# -----------------------------------------------------------------------------
# ⚠️ `-march=znver4` exige GCC >= 13 (Debian 12 traz GCC 12). Quando o GCC for
# mais antigo, o resolve.sh troca automaticamente para o fallback (znver3) e
# avisa. Instale um GCC novo (ou use o container) para o march completo.

FAMILY_ID="amd-zen4"
FAMILY_NAME="AMD Zen 4 (Ryzen 7000/9000, EPYC Genoa)"
FAMILY_VENDOR="amd"
FAMILY_ARCH="x86_64"

FAMILY_INHERITS="amd-zen3"

FAMILY_MARCH="-march=znver4 -mtune=znver4"
FAMILY_MARCH_MIN_GCC="13"
FAMILY_MARCH_FALLBACK="-march=znver3 -mtune=znver3"

FAMILY_ISA_REQUIRED="avx avx2 fma f16c"
FAMILY_ISA_OPTIONAL=""

FAMILY_AVX512_POLICY="never"

FAMILY_MATCH_NAME="Ryzen .* (7[0-9]{3}|9[0-9]{3})|EPYC .* 9[0-9]{2}4|Threadripper .* 7[0-9]{3}"
FAMILY_CPUID_HINT="family 25 (0x19) — Zen 4"
FAMILY_NOTES="Zen 5 (Ryzen 9000 desktop é Zen 5!) também cai aqui por padrão: use-o como base até o toolchain ter znver5. Ver docs/FAMILIES.md."
