# families/intel-sapphirerapids-sp/family.conf — Intel Xeon Scalable v8 (Sapphire Rapids)
# -----------------------------------------------------------------------------
# 4ª geração Xeon Scalable: Silver 44xx, Gold 54xx/64xx, Platinum 84xx,
# Xeon W-24xx/W-34xx e Xeon Max 94xx (HBM). AVX-512 + FP16 + AMX (tile).
# Política 'auto': AVX-512 padrão; AMX entra se a CPU reportar amx_tile.

FAMILY_ID="intel-sapphirerapids-sp"
FAMILY_NAME="Intel Xeon Scalable v8 (Sapphire Rapids)"
FAMILY_VENDOR="intel"
FAMILY_ARCH="x86_64"

FAMILY_INHERITS="intel-icelake-sp"

FAMILY_MARCH="-march=sapphirerapids -mtune=sapphirerapids"
FAMILY_MARCH_MIN_GCC="12"
FAMILY_MARCH_FALLBACK="-march=icelake-server -mtune=icelake-server"
FAMILY_MARCH_HAS_AVX512="yes"

FAMILY_ISA_REQUIRED="avx avx2 fma f16c"
FAMILY_ISA_OPTIONAL="avx512f avx512cd avx512bw avx512dq avx512vl avx512vnni avx512vbmi avx512vbmi2 avx512bitalg avx512vpopcntdq avx512fp16 amx_tile amx_int8 amx_bf16"

FAMILY_AVX512_POLICY="auto"

FAMILY_MATCH_NAME="(Gold|Platinum|Silver) (44[0-9]{2}|54[0-9]{2}|64[0-9]{2}|84[0-9]{2})|W-24[0-9]{2}|W-34[0-9]{2}|Max 9[0-9]{3}|Sapphire ?Rapids"
FAMILY_CPUID_HINT="family 6 / model 143 — Sapphire Rapids"
FAMILY_NOTES="AVX-512 liga por padrão; AMX (amx_tile) entra automaticamente quando presente (GGML_AMX)."
