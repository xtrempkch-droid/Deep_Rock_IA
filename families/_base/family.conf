# families/_base/family.conf — padrões herdados por TODAS as famílias
# -----------------------------------------------------------------------------
# Este arquivo é carregado PRIMEIRO. Toda família começa daqui e sobrescreve o
# que precisar. Não edite valores específicos de hardware aqui.

FAMILY_ID="base"
FAMILY_NAME="Base (padrões do projeto)"
FAMILY_VENDOR="generic"
FAMILY_ARCH="x86_64"

# Herança (nenhuma, é a raiz).
FAMILY_INHERITS=""

# Flags de arquitetura. Vazio = não passa -march (deixa o compilador decidir
# com GGML_NATIVE). Famílias específicas sobrescrevem.
FAMILY_MARCH=""
FAMILY_MARCH_MIN_GCC="0"
FAMILY_MARCH_FALLBACK=""

# ISA mínima que a família SEMPRE tem (o script ainda confere em /proc/cpuinfo).
FAMILY_ISA_REQUIRED=""
FAMILY_ISA_OPTIONAL=""

# Política de AVX-512: never | optin | auto
#   never → nunca habilita (a família não tem AVX-512: habilitar = SIGILL)
#   optin → só com --allow-avx512 / AI_ALLOW_AVX512=1
#   auto  → habilita se a CPU reportar a flag (usado por `generic`)
FAMILY_AVX512_POLICY="never"

# Como reconhecer a família pelo nome do CPU (ERE, aplicado a /proc/cpuinfo).
FAMILY_MATCH_NAME=""

# Dica informativa (aparece no relatório).
FAMILY_CPUID_HINT=""
FAMILY_NOTES="Família base: padrões comuns a todas as famílias do projeto."
