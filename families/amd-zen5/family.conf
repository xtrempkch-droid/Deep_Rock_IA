# families/amd-zen5/family.conf — AMD Zen 5 (Ryzen 9000, Ryzen AI 300, EPYC Turin)
# -----------------------------------------------------------------------------
# Zen 5 é o primeiro Zen com datapath AVX-512 de 512 bits NATIVO (Zen 4 fazia
# 256+256). Política 'auto': o AVX-512 liga por padrão — é onde ele mais rende.
#
# ⚠️ `-march=znver5` exige GCC >= 14 (Ubuntu 24.04 traz GCC 13 → cai em znver4,
# com aviso; instale `gcc-14` para o march completo). Ver docs/FAMILIES.md § 9.4.

FAMILY_ID="amd-zen5"
FAMILY_NAME="AMD Zen 5 (Ryzen 9000, Ryzen AI 300, EPYC Turin)"
FAMILY_VENDOR="amd"
FAMILY_ARCH="x86_64"

FAMILY_INHERITS="amd-zen4"

FAMILY_MARCH="-march=znver5 -mtune=znver5"
FAMILY_MARCH_MIN_GCC="14"
FAMILY_MARCH_FALLBACK="-march=znver4 -mtune=znver4"
FAMILY_MARCH_HAS_AVX512="yes"

FAMILY_ISA_REQUIRED="avx avx2 fma f16c"
FAMILY_ISA_OPTIONAL="avx512f avx512cd avx512dq avx512bw avx512vl avx512vnni avx512vbmi avx512vbmi2 avx512bitalg avx512vpopcntdq"

FAMILY_AVX512_POLICY="auto"

# Ryzen 9000 desktop/Threadripper, Ryzen AI 300 (Strix Point) e EPYC 9005
# (Turin: 9xx5). A série 8000 (8500G etc.) é Zen 4 e fica com amd-zen4.
FAMILY_MATCH_NAME="Ryzen .* 9[0-9]{3}|Ryzen AI( Max)? .*[0-9]{2,3}|EPYC 9[0-9]{2}5|Threadripper .* 9[0-9]{3}|Zen ?5"
FAMILY_CPUID_HINT="family 26 (0x1A) — Zen 5"
FAMILY_NOTES="AVX-512 de 512 bits nativo: política 'auto' liga por padrão quando a CPU reporta a flag. znver5 exige GCC >= 14; senão cai em znver4 (com aviso)."
