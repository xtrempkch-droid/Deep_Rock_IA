# families/intel-skylake-avx512/family.conf — Intel Xeon Scalable v5/v6
# -----------------------------------------------------------------------------
# Primeira família com AVX-512 **opt-in**. Aqui a porta fica ABERTA: se a CPU
# tiver as flags (verificado em /proc/cpuinfo), o AVX-512 pode ser habilitado.
#
# ⚠️ Por que opt-in e não automático: AVX-512 nestas gerações derruba a
# frequência (licensing/downclocking) e consome bem mais energia. Em inferência
# em CPU, muitas vezes AVX2 com frequência alta ganha. Então: medimos.

FAMILY_ID="intel-skylake-avx512"
FAMILY_NAME="Intel Xeon Scalable v5/v6 (Skylake-SP / Cascade Lake)"
FAMILY_VENDOR="intel"
FAMILY_ARCH="x86_64"

FAMILY_INHERITS="intel-broadwell"

FAMILY_MARCH="-march=skylake-avx512 -mtune=skylake-avx512"
FAMILY_MARCH_MIN_GCC="6"
# Sem AVX-512 (ex.: pedimos --no-avx512), volta para o march do Broadwell.
FAMILY_MARCH_FALLBACK="-march=broadwell -mtune=broadwell"

FAMILY_ISA_REQUIRED="avx avx2 fma f16c"
FAMILY_ISA_OPTIONAL="avx512f avx512cd avx512bw avx512dq avx512vl avx512vnni amx_tile"

# optin: só liga com --allow-avx512 / AI_ALLOW_AVX512=1
FAMILY_AVX512_POLICY="optin"

FAMILY_MATCH_NAME="E5-[0-9]{4} ?v5|(Gold|Platinum|Silver|Bronze) [0-9]{4}|Skylake|Cascade ?Lake"
FAMILY_CPUID_HINT="family 6 / model 85 (Skylake-SP) ou 85/106 (Cascade Lake)"
FAMILY_NOTES="AVX-512 disponível mas OPT-IN. Ligue com --allow-avx512 e MECA: o downclock do AVX-512 pode reduzir tokens/s frente ao AVX2."
