# families/intel-skylake-avx512/family.conf — Intel Xeon Scalable v5 (Skylake-SP)
# -----------------------------------------------------------------------------
# Primeira geração Xeon Scalable: Bronze 31xx, Silver 41xx, Gold 51xx/61xx,
# Platinum 81xx e Xeon W-21xx.
#
# Política 'auto' (decisão do dono, 2026-10-16): o AVX-512 é o PADRÃO quando a
# CPU reporta a flag — verificação em runtime, nunca flag fixa (Regra 12).
# ⚠️ Nota de engenharia: AVX-512 nestas gerações derruba a frequência
# (licensing/downclocking). Se quiser comparar AVX2 antes: --no-avx512
# (o march cai para o broadwell).

FAMILY_ID="intel-skylake-avx512"
FAMILY_NAME="Intel Xeon Scalable v5 (Skylake-SP)"
FAMILY_VENDOR="intel"
FAMILY_ARCH="x86_64"

FAMILY_INHERITS="intel-broadwell"

FAMILY_MARCH="-march=skylake-avx512 -mtune=skylake-avx512"
FAMILY_MARCH_MIN_GCC="6"
# Sem AVX-512 (--no-avx512 ou CPU sem a flag), volta para o march do Broadwell.
FAMILY_MARCH_FALLBACK="-march=broadwell -mtune=broadwell"
FAMILY_MARCH_HAS_AVX512="yes"

FAMILY_ISA_REQUIRED="avx avx2 fma f16c"
FAMILY_ISA_OPTIONAL="avx512f avx512cd avx512bw avx512dq avx512vl avx512vnni amx_tile"

# auto: liga por padrão quando a CPU tem a flag (decisão do dono, 2026-10-16).
FAMILY_AVX512_POLICY="auto"

FAMILY_MATCH_NAME="E5-[0-9]{4} ?v5|(Gold|Platinum|Silver|Bronze) (31[0-9]{2}|41[0-9]{2}|51[0-9]{2}|61[0-9]{2}|81[0-9]{2})|W-21[0-9]{2}|Skylake"
FAMILY_CPUID_HINT="family 6 / model 85 (Skylake-SP)"
FAMILY_NOTES="AVX-512 liga por padrão (política 'auto'). MECA: o downclock do AVX-512 pode reduzir tokens/s frente ao AVX2 em cargas leves — desligue com --no-avx512 se for o caso."
