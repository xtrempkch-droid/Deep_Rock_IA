# families/generic/family.conf — fallback para qualquer x86-64
# -----------------------------------------------------------------------------
# É para AQUI que o resolve.sh cai quando o CPU não casa com nenhuma família
# conhecida (ou quando o usuário força `--family generic`).
#
# Objetivo: permitir que "outras máquinas" — inclusive futuras, com AVX-512 ou
# AMX — usem o projeto. Sem -march específico (usa a ISA real detectada) e com
# política de AVX-512 = auto (liga se a CPU reportar a flag).

FAMILY_ID="generic"
FAMILY_NAME="Genérica x86-64 (fallback)"
FAMILY_VENDOR="generic"
FAMILY_ARCH="x86_64"

FAMILY_INHERITS=""

# Sem -march: deixa o compilador usar a ISA real (GGML_NATIVE=ON) e confiamos
# no fallback do próprio llama.cpp. Assim funcionamos em qualquer x86-64.
FAMILY_MARCH=""
FAMILY_MARCH_MIN_GCC="0"
FAMILY_MARCH_FALLBACK=""

FAMILY_ISA_REQUIRED="avx2 fma f16c"
FAMILY_ISA_OPTIONAL="avx512f avx512vnni amx_tile"

# auto: liga o AVX-512 se a CPU REALMENTE tiver (verificado em /proc/cpuinfo).
FAMILY_AVX512_POLICY="auto"

FAMILY_MATCH_NAME=""
FAMILY_CPUID_HINT="qualquer x86-64"
FAMILY_NOTES="Fallback: sem -march específico, ISA detectada em runtime e AVX-512 automático se presente. Bom ponto de partida para CPUs novas."
