# families/intel-icelake-sp/family.conf — Intel Xeon Scalable v7 (Ice Lake-SP)
# -----------------------------------------------------------------------------
# 3ª geração Xeon Scalable: Silver 43xx, Gold 53xx/63xx, Platinum 83xx e
# Xeon W-33xx. AVX-512 completo + VNNI/VBMI/BITALG. Política 'auto'.

FAMILY_ID="intel-icelake-sp"
FAMILY_NAME="Intel Xeon Scalable v7 (Ice Lake-SP)"
FAMILY_VENDOR="intel"
FAMILY_ARCH="x86_64"

FAMILY_INHERITS="intel-cascadelake-sp"

FAMILY_MARCH="-march=icelake-server -mtune=icelake-server"
FAMILY_MARCH_MIN_GCC="8"
FAMILY_MARCH_FALLBACK="-march=cascadelake -mtune=cascadelake"
FAMILY_MARCH_HAS_AVX512="yes"

FAMILY_ISA_REQUIRED="avx avx2 fma f16c"
FAMILY_ISA_OPTIONAL="avx512f avx512cd avx512bw avx512dq avx512vl avx512vnni avx512vbmi avx512vbmi2 avx512bitalg avx512vpopcntdq"

FAMILY_AVX512_POLICY="auto"

FAMILY_MATCH_NAME="(Gold|Platinum|Silver) (43[0-9]{2}|53[0-9]{2}|63[0-9]{2}|83[0-9]{2})|W-33[0-9]{2}|Ice ?Lake"
FAMILY_CPUID_HINT="family 6 / model 106 — Ice Lake-SP"
FAMILY_NOTES="AVX-512 liga por padrão (política 'auto'). VBMI2/BITALG aceleram kernels de quantização no ggml."
