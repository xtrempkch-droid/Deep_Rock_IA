# families/intel-emeraldrapids-sp/family.conf — Intel Xeon Scalable v9 (Emerald Rapids)
# -----------------------------------------------------------------------------
# 5ª geração Xeon Scalable: Silver 45xx, Gold 55xx/65xx, Platinum 85xx e
# Xeon W-25xx/W-35xx (o "Sapphire Rapids refresh"). Mesma ISA do v8 + melhoras.

FAMILY_ID="intel-emeraldrapids-sp"
FAMILY_NAME="Intel Xeon Scalable v9 (Emerald Rapids)"
FAMILY_VENDOR="intel"
FAMILY_ARCH="x86_64"

FAMILY_INHERITS="intel-sapphirerapids-sp"

FAMILY_MARCH="-march=emeraldrapids -mtune=emeraldrapids"
FAMILY_MARCH_MIN_GCC="13"
FAMILY_MARCH_FALLBACK="-march=sapphirerapids -mtune=sapphirerapids"
FAMILY_MARCH_HAS_AVX512="yes"

FAMILY_ISA_REQUIRED="avx avx2 fma f16c"
FAMILY_ISA_OPTIONAL="avx512f avx512cd avx512bw avx512dq avx512vl avx512vnni avx512vbmi avx512vbmi2 avx512bitalg avx512vpopcntdq avx512fp16 amx_tile amx_int8 amx_bf16"

FAMILY_AVX512_POLICY="auto"

FAMILY_MATCH_NAME="(Gold|Platinum|Silver) (45[0-9]{2}|55[0-9]{2}|65[0-9]{2}|85[0-9]{2})|W-25[0-9]{2}|W-35[0-9]{2}|Emerald ?Rapids"
FAMILY_CPUID_HINT="family 6 / model 207 — Emerald Rapids"
FAMILY_NOTES="AVX-512 liga por padrão; AMX entra automaticamente quando presente."
