# families/intel-haswell/family.conf — Intel Xeon E5 v3 (Haswell-EP)
# -----------------------------------------------------------------------------
# Cobre TODA a família v3, por exemplo: E5-2678 v3, E5-2680 v3, E5-2620 v3,
# E5-2660 v3, E7-48xx v3 ... — não é preciso um arquivo por modelo.

FAMILY_ID="intel-haswell"
FAMILY_NAME="Intel Xeon E5 v3 (Haswell-EP)"
FAMILY_VENDOR="intel"
FAMILY_ARCH="x86_64"

FAMILY_INHERITS=""

# Haswell-EP: AVX2 (256-bit), FMA, F16C, BMI. NÃO tem AVX-512 nem AMX.
FAMILY_MARCH="-march=haswell -mtune=haswell"
FAMILY_MARCH_MIN_GCC="4"
FAMILY_MARCH_FALLBACK=""

FAMILY_ISA_REQUIRED="avx avx2 fma f16c"
FAMILY_ISA_OPTIONAL=""

# Haswell NÃO tem AVX-512: habilitar causaria SIGILL. Política imutável.
FAMILY_AVX512_POLICY="never"

FAMILY_MATCH_NAME="E5-[0-9]{4} ?v3|E7-[0-9]{3,4} ?v3|Xeon.*Haswell|Haswell"
FAMILY_CPUID_HINT="family 6 / model 63 (Haswell-EP)"
FAMILY_NOTES="Alvo clássico do projeto. 12c/24t no E5-2678 v3. Banda de memória é o gargalo real de tokens/s."
