# families/amd-zen2/family.conf — AMD Zen 2 (Ryzen 3000/4000, EPYC Rome)
# -----------------------------------------------------------------------------
# Família do Ryzen 5 3500X (alvo do projeto). Cobre TODOS os Zen 2 — o que
# melhora aqui beneficia 3600, 3700X, 3900X, 3500X, 4300G, EPYC 7xx2 etc.

FAMILY_ID="amd-zen2"
FAMILY_NAME="AMD Zen 2 (Ryzen 3000/4000, EPYC Rome)"
FAMILY_VENDOR="amd"
FAMILY_ARCH="x86_64"

FAMILY_INHERITS="amd-zen1"

FAMILY_MARCH="-march=znver2 -mtune=znver2"
FAMILY_MARCH_MIN_GCC="9"
FAMILY_MARCH_FALLBACK="-march=znver1 -mtune=znver1"

FAMILY_ISA_REQUIRED="avx avx2 fma f16c"
FAMILY_ISA_OPTIONAL=""

FAMILY_AVX512_POLICY="never"

# Rome = 7xxx**2** (o sufixo da geração é o último dígito). Ver a nota em amd-zen1.
FAMILY_MATCH_NAME="Ryzen .* (3[0-9]{3}|4[0-9]{3})|EPYC [0-9]{3}2|Threadripper .* 3[0-9]{3}"
FAMILY_CPUID_HINT="family 23 (0x17) — Zen 2"
FAMILY_NOTES="Alvo do projeto (Ryzen 5 3500X, 6c/6t). Em AM4, confirme o DUAL CHANNEL: single channel custa ~50% da banda e derruba tokens/s. ⚠️ APUs 'G' (3200G/3400G) são Zen+/Zen 2 híbridos: se der SIGILL, force --family amd-zen1."
