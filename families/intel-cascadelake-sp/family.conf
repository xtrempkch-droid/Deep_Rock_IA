# families/intel-cascadelake-sp/family.conf — Intel Xeon Scalable v6 (Cascade Lake-SP)
# -----------------------------------------------------------------------------
# 2ª geração Xeon Scalable: Bronze 32xx, Silver 42xx, Gold 52xx/62xx,
# Platinum 82xx e Xeon W-22xx. AVX-512 + VNNI (avx512vnni, útil para
# quantização). Política 'auto': o AVX-512 liga por padrão quando a CPU o tem.

FAMILY_ID="intel-cascadelake-sp"
FAMILY_NAME="Intel Xeon Scalable v6 (Cascade Lake-SP)"
FAMILY_VENDOR="intel"
FAMILY_ARCH="x86_64"

FAMILY_INHERITS="intel-skylake-avx512"

FAMILY_MARCH="-march=cascadelake -mtune=cascadelake"
FAMILY_MARCH_MIN_GCC="8"
FAMILY_MARCH_FALLBACK="-march=skylake-avx512 -mtune=skylake-avx512"
FAMILY_MARCH_HAS_AVX512="yes"

FAMILY_ISA_REQUIRED="avx avx2 fma f16c"
FAMILY_ISA_OPTIONAL="avx512f avx512cd avx512bw avx512dq avx512vl avx512vnni"

FAMILY_AVX512_POLICY="auto"

FAMILY_MATCH_NAME="(Gold|Platinum|Silver|Bronze) (32[0-9]{2}|42[0-9]{2}|52[0-9]{2}|62[0-9]{2}|82[0-9]{2})|W-22[0-9]{2}|Cascade ?Lake"
FAMILY_CPUID_HINT="family 6 / model 85 (steppings mais novos) — Cascade Lake-SP"
FAMILY_NOTES="AVX-512 liga por padrão (política 'auto'): o build usa se a CPU reportar a flag. Para medir AVX2 antes: --no-avx512."
