# families/amd-zen3/family.conf — AMD Zen 3 (Ryzen 5000/6000)
# -----------------------------------------------------------------------------

FAMILY_ID="amd-zen3"
FAMILY_NAME="AMD Zen 3 (Ryzen 5000/6000, EPYC Milan)"
FAMILY_VENDOR="amd"
FAMILY_ARCH="x86_64"

FAMILY_INHERITS="amd-zen2"

FAMILY_MARCH="-march=znver3 -mtune=znver3"
FAMILY_MARCH_MIN_GCC="11"
FAMILY_MARCH_FALLBACK="-march=znver2 -mtune=znver2"

FAMILY_ISA_REQUIRED="avx avx2 fma f16c"
FAMILY_ISA_OPTIONAL=""

FAMILY_AVX512_POLICY="never"

FAMILY_MATCH_NAME="Ryzen .* (5[0-9]{3}|6[0-9]{3})|EPYC [0-9]{3}3|Threadripper .* 5[0-9]{3}"
FAMILY_CPUID_HINT="family 25 (0x19) — Zen 3"
FAMILY_NOTES="Herda o tuning do Zen 2. Zen 3 tem L3 unificado por CCX (óptimo para KV cache)."
