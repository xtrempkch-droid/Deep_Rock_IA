# mods/apt-sources/mod.conf
MOD_ID="apt-sources"
MOD_NAME="Reparar as fontes do apt (repositório que não existe)"
MOD_DESC="Diagnostica e conserta o apt de uma máquina JÁ instalada: remove fontes que não existem mais (o 'file:///opt/apt-repo' deixado pela ISO quando o repositório não foi copiado, o 'deb cdrom:' que o instalador grava, .list/.sources quebrados) e, se não sobrar nenhuma fonte utilizável, grava a lista oficial da distro. Faz backup de tudo antes."
MOD_RISK="medium"
MOD_REBOOT="no"
MOD_REQUIRES="cmd:apt-get"
MOD_FAMILIES="any"
MOD_ROLES="any"
# Conjunto próprio: mexer nas fontes de pacotes é decisão do dono da máquina.
# `apply --set system` roda no build da ISO — não queremos que a aplicação de
# tuning reescreva o sources.list de ninguém.
MOD_SETS="apt"
MOD_ORDER="20"
MOD_GAIN="Destrava o apt de quem instalou com a ISO antiga e ficou com 'algum repositório não tem um arquivo Release' em TODO apt-get update — sem apt funcionando não se instala nem o openssh-server."
