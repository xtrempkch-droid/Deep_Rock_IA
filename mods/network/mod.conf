# mods/network/mod.conf
MOD_ID="network"
MOD_NAME="Rede persistente (netplan) com DHCP"
MOD_DESC="Grava /etc/netplan/99-ai-cpu-os.yaml para a placa subir SOZINHA (DHCP por padrão), move o netplan do instalador/cloud-init para .bak e desliga a rede do cloud-init. É o reparo para a instalação que subia sem IP."
MOD_RISK="medium"
MOD_REBOOT="no"
MOD_REQUIRES="cmd:netplan"
MOD_FAMILIES="any"
MOD_ROLES="any"
# Conjunto próprio: NÃO entra em `system` nem em `portable`. Mudar a rede de um
# servidor é decisão do dono da máquina, e `apply --set system` roda no build —
# não queremos que uma aplicação de tuning mexa na conectividade.
MOD_SETS="network"
MOD_ORDER="10"
MOD_GAIN="O alvo deixa de precisar de 'ip link'/'dhclient' à mão em todo boot (o Subiquity não grava rede persistente sem a chave network: no autoinstall)."
