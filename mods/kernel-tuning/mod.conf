# mods/kernel-tuning/mod.conf
MOD_ID="kernel-tuning"
MOD_NAME="Tuning de kernel (sysctl + cmdline + io_uring)"
MOD_DESC="sysctl de memória/vm, desativa C-states profundos e confere io_uring."
MOD_RISK="medium"
MOD_REBOOT="yes"
MOD_REQUIRES="root path:/etc/sysctl.d"
MOD_FAMILIES="any"
MOD_ROLES="any"
MOD_SETS="system"
MOD_ORDER="10"
MOD_GAIN="Reduz latência de memória e wake-up (C-state ~100µs → ~1µs)."
