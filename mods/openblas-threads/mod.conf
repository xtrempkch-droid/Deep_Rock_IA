# mods/openblas-threads/mod.conf
MOD_ID="openblas-threads"
MOD_NAME="OpenBLAS com 1 thread"
MOD_DESC="Define OPENBLAS_NUM_THREADS=1/OPENBLAS_THREAD_TIMEOUT para o llama.cpp não brigar com os threads do ggml."
MOD_RISK="low"
MOD_REBOOT="no"
MOD_REQUIRES="path:/etc/environment"
MOD_FAMILIES="any"
MOD_ROLES="inference"
MOD_SETS="portable"
MOD_ORDER="40"
MOD_GAIN="Evita oversubscription de threads no prompt processing; reduz jitter de latência."
